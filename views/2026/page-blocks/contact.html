<div class="page" data-page="contact">
  <div class="sub-hero"><div class="wrap">
    <div class="eyeb">Diagnosis</div>
    <h1>预约「<em>AI 场景诊断</em>」</h1>
    <p>从一次轻量的场景诊断开始，快速定位你组织的进化起点。提交后顾问将在 1 个工作日内联系你。</p>
  </div></div>
  <section class="section"><div data-sx="s43" class="contact-grid">
    <form class="form" id="cForm" data-evt-submit="e21">
      <label>企业名称 <span class="req">*</span></label><input type="text" id="fCompany">
      <label>姓名 <span class="req">*</span></label><input type="text" id="fName">
      <label>部门</label>
      <select id="fDept">
        <option value="">请选择部门</option>
        <option value="市场">市场</option>
        <option value="销售">销售</option>
        <option value="HR">HR</option>
        <option value="财务">财务</option>
        <option value="客服">客服</option>
        <option value="产品">产品</option>
        <option value="研发">研发</option>
        <option value="其他">其他</option>
      </select>
      <label>职位</label><input type="text" id="fTitle">
      <label>手机号 <span class="req">*</span></label><input type="tel" id="fPhone" inputmode="tel" maxlength="20" placeholder="请输入 11 位手机号">
      <label>邮箱</label><input type="email" id="fEmail">
      <label>感兴趣的方向（可多选）</label>
      <div class="cbs">
        <label><input type="checkbox">AI 赋能培训</label>
        <label><input type="checkbox">AI 转型咨询</label>
        <label><input type="checkbox">AI 落地陪跑</label>
        <label><input type="checkbox">人力资本价值经营</label>
        <label><input type="checkbox">还不确定，先聊聊</label>
      </div>
      <label>想解决的问题</label><textarea id="fMsg" rows="3" placeholder="比如：客服工单量大，想看看 Agent 能不能接……"></textarea>
      <p data-sx="s44"><button class="btn" type="submit" data-sx="s45">提交预约 →</button>
      <span data-sx="s46">提交即代表同意《隐私政策》</span></p>
    </form>
    <div class="contact-side">
      <b>联系我们</b><br>
      <!--CONFIG_TEL--><br>
      <!--CONFIG_MAIL--><br>
      <!--CONFIG_CITIES--><br><br>
      <b>更快的方式</b><br>
      <button type="button" data-evt-click="e1" data-sx="s39">找 AI 顾问先聊两句 →</button>
    </div>
  </div></section>
</div>
