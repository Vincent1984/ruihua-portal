<!-- 全站浮层：领取报告弹窗（导航按钮、首页 Hero、首页成果区、研究成果详情页共用）；提示条。
     样式沿用首页现有的白皮书预约弹窗，去掉了短信验证码。默认领取最新一份报告。 -->
<dialog class="report-dialog report-dialog--media rounded-2xl bg-gradient-to-b from-[#1a1c2e] to-[#111424] border border-white/10 text-left shadow-[0_0_50px_rgba(124,77,255,0.15)]" id="report-dialog" aria-labelledby="report-dialog-title" data-dialog
  data-default-name="<!--CONFIG_REPORT_NAME-->" data-default-subtitle="<!--CONFIG_REPORT_SUBTITLE-->" data-default-slug="<!--CONFIG_REPORT_SLUG-->"
  data-default-cover="<!--CONFIG_REPORT_COVER-->" data-default-cover-alt="<!--CONFIG_REPORT_COVER_ALT-->">
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[80%] h-32 bg-[var(--nqoc-brand)]/20 blur-[60px] rounded-full pointer-events-none" aria-hidden="true"></div>
  <button type="button" class="absolute right-4 top-4 z-20 rounded-full w-11 h-11 flex items-center justify-center bg-white/5 text-slate-400 hover:text-white hover:bg-white/10 transition-colors" aria-label="关闭" data-dialog-close><i class="fas fa-times text-lg" aria-hidden="true"></i></button>
  <div class="report-dialog__grid relative z-10">
    <!-- 左栏：报告封面 + 领取理由，提升「这是一份真东西」的信任感 -->
    <aside class="report-dialog__media" data-report-media>
      <div class="report-dialog__cover">
        <img src="<!--CONFIG_REPORT_COVER-->" alt="<!--CONFIG_REPORT_COVER_ALT-->" width="750" height="1000" loading="lazy" decoding="async" data-report-cover-img />
        <span class="report-dialog__badge">免费领取</span>
      </div>
      <ul class="report-dialog__points">
        <li><i class="fas fa-file-pdf" aria-hidden="true"></i>完整版 PDF，非摘要版</li>
        <li><i class="fas fa-bolt" aria-hidden="true"></i>提交后立即下载</li>
        <li><i class="fas fa-shield-alt" aria-hidden="true"></i>信息仅用于发送报告</li>
      </ul>
    </aside>
    <div class="report-dialog__body px-6 pb-8 pt-10 sm:px-8">
    <div class="text-center mb-6">
      <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-[var(--nqoc-brand)] to-[var(--nqoc-brand-dark)] shadow-lg shadow-[var(--nqoc-brand)]/30 mb-4 relative overflow-hidden">
        <div class="absolute inset-0 bg-white/20 mix-blend-overlay"></div>
        <i class="fas fa-file-alt text-white text-xl relative z-10" aria-hidden="true"></i>
      </div>
      <h2 class="text-xl sm:text-[22px] font-bold text-white mb-2" id="report-dialog-title" data-report-name>领取报告</h2>
      <p class="text-sm text-slate-300" data-report-subtitle></p>
      <p class="report-dialog__hint">填写以下信息，即可免费获取完整版报告</p>
    </div>
    <form class="space-y-4" novalidate data-report-form>
      <input type="hidden" name="reportSlug" value="" data-report-slug />
      <input class="form__trap" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <div class="relative group">
          <label class="sr-only" for="rf-name">您的姓名</label>
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i class="fas fa-user text-slate-500 group-focus-within:text-[var(--nqoc-brand-light)] transition-colors" aria-hidden="true"></i></div>
          <input class="report-form__input w-full bg-[#0a0c16]/50 border border-white/10 rounded-xl pl-11 pr-4 py-3.5 text-white focus:outline-none focus:border-[var(--nqoc-brand)] focus:bg-[#0a0c16]/80 transition-all placeholder-slate-400 shadow-inner" id="rf-name" name="name" type="text" autocomplete="name" required aria-describedby="rf-name-err" placeholder="您的姓名" />
        </div>
        <p class="field__err" id="rf-name-err" hidden></p>
      </div>
      <div>
        <div class="relative group">
          <label class="sr-only" for="rf-phone">手机号码</label>
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i class="fas fa-mobile-alt text-slate-500 group-focus-within:text-[var(--nqoc-brand-light)] transition-colors" aria-hidden="true"></i></div>
          <input class="report-form__input w-full bg-[#0a0c16]/50 border border-white/10 rounded-xl pl-11 pr-4 py-3.5 text-white focus:outline-none focus:border-[var(--nqoc-brand)] focus:bg-[#0a0c16]/80 transition-all placeholder-slate-400 shadow-inner" id="rf-phone" name="phone" type="tel" autocomplete="tel" inputmode="numeric" required aria-describedby="rf-phone-err" placeholder="手机号码" />
        </div>
        <p class="field__err" id="rf-phone-err" hidden></p>
      </div>
      </div>
      <div>
        <div class="relative group">
          <label class="sr-only" for="rf-company">公司名称</label>
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i class="fas fa-building text-slate-500 group-focus-within:text-[var(--nqoc-brand-light)] transition-colors" aria-hidden="true"></i></div>
          <input class="report-form__input w-full bg-[#0a0c16]/50 border border-white/10 rounded-xl pl-11 pr-4 py-3.5 text-white focus:outline-none focus:border-[var(--nqoc-brand)] focus:bg-[#0a0c16]/80 transition-all placeholder-slate-400 shadow-inner" id="rf-company" name="company" type="text" autocomplete="organization" required aria-describedby="rf-company-err" placeholder="公司名称" />
        </div>
        <p class="field__err" id="rf-company-err" hidden></p>
      </div>
      <div>
        <div class="relative group">
          <label class="sr-only" for="rf-position">您的职位</label>
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i class="fas fa-id-badge text-slate-500 group-focus-within:text-[var(--nqoc-brand-light)] transition-colors" aria-hidden="true"></i></div>
          <input class="report-form__input w-full bg-[#0a0c16]/50 border border-white/10 rounded-xl pl-11 pr-4 py-3.5 text-white focus:outline-none focus:border-[var(--nqoc-brand)] focus:bg-[#0a0c16]/80 transition-all placeholder-slate-400 shadow-inner" id="rf-position" name="position" type="text" autocomplete="organization-title" required aria-describedby="rf-position-err" placeholder="您的职位" />
        </div>
        <p class="field__err" id="rf-position-err" hidden></p>
      </div>
      <div>
        <div class="relative group">
          <label class="sr-only" for="rf-email">接收报告邮箱</label>
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i class="fas fa-envelope text-slate-500 group-focus-within:text-[var(--nqoc-brand-light)] transition-colors" aria-hidden="true"></i></div>
          <input class="report-form__input w-full bg-[#0a0c16]/50 border border-white/10 rounded-xl pl-11 pr-4 py-3.5 text-white focus:outline-none focus:border-[var(--nqoc-brand)] focus:bg-[#0a0c16]/80 transition-all placeholder-slate-400 shadow-inner" id="rf-email" name="email" type="email" autocomplete="email" required aria-describedby="rf-email-err" placeholder="接收报告邮箱" />
        </div>
        <p class="field__err" id="rf-email-err" hidden></p>
      </div>
      <div class="pt-4">
        <button class="report-form__submit w-full flex items-center justify-center gap-2 bg-white text-[#0a0c16] font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(255,255,255,0.15)] hover:bg-slate-100 transition-all" type="submit"><span data-submit-text>立即免费领取完整版报告</span> <i class="fas fa-arrow-right" aria-hidden="true"></i></button>
        <p class="report-dialog__privacy">仅用于发送报告 · 不电话回访 · 不营销推送</p>
      </div>
      <p class="form__status" role="status" data-form-status hidden></p>
      <p class="text-center"><a class="inline-flex items-center gap-2 min-h-11 text-sm text-slate-400 hover:text-white transition-colors" href="/nqoc/whitepaper" data-dialog-close><i class="fas fa-arrow-left" aria-hidden="true"></i> 返回研究成果</a></p>
    </form>
    </div>
  </div>
</dialog>
<!-- 领取报告提交成功弹窗：信息已提交但报告文件尚未就绪时使用 -->
<dialog class="report-dialog rounded-2xl bg-gradient-to-b from-[#1a1c2e] to-[#111424] border border-white/10 text-left shadow-[0_0_50px_rgba(124,77,255,0.15)]" id="report-result-dialog" aria-labelledby="report-result-title" data-dialog>
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[80%] h-32 bg-[var(--nqoc-brand)]/20 blur-[60px] rounded-full pointer-events-none" aria-hidden="true"></div>
  <button type="button" class="absolute right-4 top-4 z-20 rounded-full w-11 h-11 flex items-center justify-center bg-white/5 text-slate-400 hover:text-white hover:bg-white/10 transition-colors" aria-label="关闭" data-dialog-close><i class="fas fa-times text-lg" aria-hidden="true"></i></button>
  <div class="px-6 pb-8 pt-10 sm:px-10 relative z-10">
    <div class="text-center mb-8">
      <div class="mx-auto flex h-14 w-14 flex-shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-[var(--nqoc-brand)] to-[var(--nqoc-brand-dark)] shadow-lg shadow-[var(--nqoc-brand)]/30 mb-5 relative overflow-hidden">
        <i class="fas fa-check text-white text-2xl relative z-10" aria-hidden="true"></i>
      </div>
      <h2 class="text-xl sm:text-[22px] font-bold text-white mb-2" id="report-result-title">提交成功</h2>
      <p class="text-sm text-slate-300 leading-relaxed" data-result-message></p>
    </div>
    <button type="button" class="w-full bg-white text-[#0a0c16] font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(255,255,255,0.15)] hover:bg-slate-100 transition-all" data-dialog-close>知道了</button>
  </div>
</dialog>
<div class="toast" role="status" data-toast hidden></div>
