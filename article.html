<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章详情 - 瑞华智策</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <!-- Highlight.js -->
    <link href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/monokai-sublime.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.7.0/build/highlight.min.js"></script>
    
    <link rel="stylesheet" href="/css/styles.css?v=20260112-3" />
    <script src="/js/script.js?v=20260112-3"></script>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/tailwind.css" />
</head>
<body class="bg-white text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-900 flex flex-col min-h-screen">

    <div id="progress-bar"></div>
<header class="relative pt-28 pb-12 bg-slate-50 border-b border-slate-200 overflow-hidden">
        <div class="absolute inset-0 z-0 opacity-40 bg-grid-slate-200 mask-gradient"></div>
        <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-brand-100 rounded-full blur-3xl opacity-40"></div>
        <div class="absolute bottom-0 left-20 w-72 h-72 bg-blue-100 rounded-full blur-3xl opacity-40"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10"> 
            <div class="max-w-4xl" id="article-header"> 
                <div class="flex items-center gap-2 text-sm text-slate-500 mb-6">
                    <a href="/" class="hover:text-brand-600">首页</a>
                    <i class="fas fa-angle-right text-xs"></i>
                    <a href="/insights/" class="hover:text-brand-600">行业洞察</a>
                    <i class="fas fa-angle-right text-xs"></i>
                    <span class="text-slate-900 font-medium line-clamp-1" id="breadcrumb-title">加载中...</span>
                </div>
                <h1 class="text-2xl md:text-4xl font-extrabold text-slate-900 mb-4 leading-tight" id="article-title">
                    <i class="fas fa-circle-notch fa-spin text-4xl text-brand-200"></i>
                </h1>
                
                <div class="flex flex-wrap items-center gap-x-3 gap-y-2 text-sm mt-4 text-[#666]">
                    <span class="meta-item">
                        发布时间：<span class="font-medium text-slate-700" id="article-date">--</span>
                    </span>
                    <span class="meta-item">
                        作者：<span class="font-medium text-slate-700" id="article-author">瑞华智策</span>
                    </span>
                    <span class="meta-item" id="article-views-container">
                        阅读量：<span class="font-medium text-slate-700" id="article-views">--</span>
                    </span>
                    <span class="meta-item">
                        更新时间：<span class="font-medium text-slate-700" id="article-updated">--</span>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full relative">
        <div class="grid lg:grid-cols-12 gap-y-8 lg:gap-y-12 lg:gap-x-10 relative">
            
            <!-- Left Column -->
            <div class="lg:col-span-8 flex flex-col relative z-10">
                <!-- Meta Description / Summary (TL;DR) -->
                <div id="article-summary" class="mb-10 p-6 bg-gradient-to-br from-brand-50 to-blue-50 rounded-xl border border-brand-100 text-slate-700 hidden shadow-sm">
                    <div class="flex items-center gap-2 mb-3 text-brand-700 font-bold text-lg">
                        <i class="fas fa-bolt text-brand-500"></i>
                        <span>核心摘要</span>
                    </div>
                    <p class="text-base leading-relaxed text-slate-600" id="article-summary-text"><!-- Summary content injected --></p>
                </div>

                <div class="prose max-w-none ql-editor mb-12" id="article-container" style="padding:0;">
                    <div class="animate-pulse space-y-4">
                        <div class="h-4 bg-slate-200 rounded w-3/4"></div>
                        <div class="h-4 bg-slate-200 rounded"></div>
                        <div class="h-4 bg-slate-200 rounded"></div>
                        <div class="h-64 bg-slate-200 rounded w-full my-8"></div>
                    </div>
                </div>
                
                <!-- Q&A Section (AI Generated) -->
                <div id="article-qa-section" class="mb-12 hidden">
                    <h3 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2 border-b pb-3">
                        <i class="fas fa-question-circle text-brand-600"></i> 核心问答 (Q&A)
                    </h3>
                    <div class="space-y-4" id="article-qa-container">
                        <!-- QA Items injected here -->
                    </div>
                </div>

                <div class="flex items-center justify-center gap-6 mb-8 lg:mb-10">
                    <button onclick="likeArticle()" class="flex items-center gap-2 px-6 py-3 rounded-full bg-slate-100 hover:bg-red-50 hover:text-red-500 transition group" id="likeBtn">
                        <i class="far fa-heart text-xl group-hover:scale-110 transition-transform"></i>
                        <span class="font-medium">点赞</span>
                        <span class="text-sm bg-white px-2 py-0.5 rounded-full shadow-sm" id="likeCount">0</span>
                    </button>
                    <button onclick="collectArticle()" class="flex items-center gap-2 px-6 py-3 rounded-full bg-slate-100 hover:bg-yellow-50 hover:text-yellow-500 transition group" id="collectBtn">
                        <i class="far fa-star text-xl group-hover:scale-110 transition-transform"></i>
                        <span class="font-medium" id="collectText">收藏</span>
                    </button>
                </div>

                <!-- Mobile visual divider -->
                <div class="lg:hidden w-full h-px bg-slate-200 mb-2"></div>
            </div>

            <!-- Right Column / Sidebar -->
            <aside class="lg:col-span-4 lg:border-l lg:border-slate-100 lg:pl-10 relative z-10">
                <div class="sticky-sidebar" id="sidebar-modules-container">
                    <!-- Sidebar modules will be injected here via SSR -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 m-0">
                        <h4 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4">作者</h4>
                        <div class="flex items-center gap-4">
                            <img src="/images/rhzclogo.png" alt="作者头像" class="w-12 h-12 rounded-full object-cover border border-slate-200 avatar" id="expert-avatar" data-fallback="/fallback-image/avatar">
                            <div>
                                <p class="font-bold text-slate-900" id="expert-title"></p>
                                <p class="text-xs text-slate-500" id="expert-desc"></p>
                            </div>
                        </div>
                        <p class="text-sm text-slate-600 mt-4 leading-relaxed transition-all duration-500 ease-in-out overflow-hidden" id="expert-detail"></p>
                    </div>

                    <div class="mt-6" id="related-articles-wrapper" style="display:none;">
                        <h4 class="text-sm font-bold text-slate-900 mb-4">相关推荐</h4>
                        <div class="space-y-4" id="related-articles-container">
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Whitepaper Download Modal -->
    <div id="whitepaperModal" class="fixed inset-0 z-[100] hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity opacity-0" id="wpModalBackdrop" onclick="closeWhitepaperModal()"></div>
        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4 text-center">
                <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 w-full max-w-lg opacity-0 scale-95" id="wpModalPanel">
                    <div class="absolute top-4 right-4 z-20">
                        <button onclick="closeWhitepaperModal()" class="text-slate-400 hover:text-slate-600 transition p-2">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>
                    <div class="bg-white px-6 py-8 sm:p-10">
                        <div class="text-center mb-8">
                            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-brand-50 mb-4">
                                <i class="fas fa-file-arrow-down text-brand-600 text-2xl"></i>
                            </div>
                            <h3 class="text-2xl font-bold text-slate-900">下载白皮书</h3>
                            <p class="mt-2 text-sm text-slate-500">请填写以下信息，我们将完整的白皮书发送至您的邮箱。</p>
                        </div>
                        
                        <form id="whitepaperForm" class="space-y-4" onsubmit="handleWhitepaperSubmit(event)">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">姓名 <span class="text-red-500">*</span></label>
                                <input type="text" name="name" required class="w-full rounded-lg border-slate-300 border px-4 py-2.5 text-sm focus:border-brand-500 focus:ring-brand-500" placeholder="请输入您的姓名">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">手机号码 <span class="text-red-500">*</span></label>
                                <input type="tel" name="phone" required pattern="^1[3-9]\d{9}$" class="w-full rounded-lg border-slate-300 border px-4 py-2.5 text-sm focus:border-brand-500 focus:ring-brand-500" placeholder="请输入11位手机号码">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">公司名称 <span class="text-red-500">*</span></label>
                                <input type="text" name="company" required class="w-full rounded-lg border-slate-300 border px-4 py-2.5 text-sm focus:border-brand-500 focus:ring-brand-500" placeholder="请输入公司全称">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">职位</label>
                                    <input type="text" name="position" class="w-full rounded-lg border-slate-300 border px-4 py-2.5 text-sm focus:border-brand-500 focus:ring-brand-500" placeholder="您的职位">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">邮箱 <span class="text-red-500">*</span></label>
                                    <input type="email" name="email" required class="w-full rounded-lg border-slate-300 border px-4 py-2.5 text-sm focus:border-brand-500 focus:ring-brand-500" placeholder="接收白皮书的邮箱">
                                </div>
                            </div>
                            
                            <div class="pt-4">
                                <button type="submit" id="wpSubmitBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all transform hover:-translate-y-0.5">
                                    立即获取完整版
                                </button>
                            </div>
                            <p class="text-xs text-slate-400 text-center mt-4">提交即代表您同意我们的隐私政策，您的信息将被严格保密。</p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="wpSuccessModal" class="fixed inset-0 z-[60] hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity opacity-0" id="wpSuccessBackdrop"></div>
        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4 text-center">
                <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 w-full max-w-sm opacity-0 scale-95" id="wpSuccessPanel">
                    <div class="bg-white px-4 pb-6 pt-6 sm:p-6 sm:pb-6">
                        <div class="flex flex-col items-center">
                            <div class="mx-auto flex h-14 w-14 flex-shrink-0 items-center justify-center rounded-full bg-green-100 mb-4">
                                <i class="fas fa-check text-green-600 text-2xl"></i>
                            </div>
                            <div class="text-center">
                                <h3 class="text-xl font-bold leading-6 text-slate-900 mb-2">提交成功</h3>
                                <div class="mt-2">
                                    <p class="text-sm text-slate-500">白皮书已发送至您的邮箱，请注意查收。</p>
                                    <p class="text-xs text-slate-400 mt-2">如未收到，请检查垃圾邮件箱或联系客服。</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 px-4 py-4 sm:px-6 flex justify-center">
                        <button type="button" class="inline-flex w-full justify-center rounded-xl bg-brand-600 px-4 py-3 text-sm font-bold text-white shadow-sm hover:bg-brand-700 transition focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2" onclick="closeWpSuccessModal()">确定</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/image-loader.js"></script>
</body>
</html>
