<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 | 瑞华智策</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind-config.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        .error-code {
            font-size: 12rem;
            line-height: 1;
            font-weight: 900;
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.1;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            user-select: none;
        }
        @media (max-width: 768px) {
            .error-code { font-size: 8rem; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-900 min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-2">
                    <a href="/" class="flex items-center gap-2">
                        <img src="/images/logo.png" alt="瑞华智策 Logo" class="h-8 w-auto" />
                    </a>
                    <span class="hidden sm:inline-block text-slate-300 mx-2">|</span>
                    <span class="hidden sm:inline-block text-sm text-slate-500">人力资本价值经营一体化解决方案</span>
                </div>
                <div class="hidden lg:flex space-x-2">
                    <a href="/" class="nav-link">首页</a>
                    <a href="/solutions/" class="nav-link">解决方案</a>
                    <a href="/resources/" class="nav-link">行业洞察</a>
                    <a href="/about/" class="nav-link">关于我们</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/productivity/" class="bg-brand-600 hover:bg-brand-700 text-white px-6 py-2.5 rounded-full font-medium transition shadow-lg shadow-brand-500/20 hover:-translate-y-0.5 text-sm hidden md:inline-flex">
                        预约专家咨询
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center relative overflow-hidden pt-20">
        <div class="absolute inset-0 bg-grid-pattern opacity-60 z-0"></div>
        <div class="error-code">404</div>
        
        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-brand-50 rounded-full mb-8 animate-bounce-slow">
                <i class="fas fa-compass text-4xl text-brand-600"></i>
            </div>
            
            <h1 class="text-4xl md:text-5xl font-bold text-slate-900 mb-6">
                抱歉，页面未找到
            </h1>
            
            <p class="text-lg text-slate-600 mb-10 max-w-xl mx-auto leading-relaxed">
                您访问的页面可能已被删除、更名或暂时无法访问。<br>
                建议您检查网址是否正确，或返回首页浏览其他内容。
            </p>

            <!-- Search Box -->
            <form action="/resources/" method="get" class="mb-10 max-w-md mx-auto relative group">
                <input type="text" name="q" placeholder="搜索文章或解决方案..." class="w-full px-5 py-4 pl-12 rounded-xl border border-slate-200 bg-white text-slate-700 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 transition shadow-sm group-hover:shadow-md">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-brand-500 transition"></i>
                <button type="submit" class="absolute right-2 top-2 bottom-2 bg-slate-50 hover:bg-brand-50 text-slate-500 hover:text-brand-600 px-4 rounded-lg transition font-medium text-sm">
                    搜索
                </button>
            </form>
            
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="/" class="w-full sm:w-auto bg-brand-600 hover:bg-brand-700 text-white px-8 py-3.5 rounded-xl font-bold transition shadow-lg shadow-brand-500/30 hover:-translate-y-0.5 flex items-center justify-center gap-2">
                    <i class="fas fa-home"></i> 返回首页
                </a>
                <a href="/solutions/" class="w-full sm:w-auto bg-white border border-slate-200 hover:border-brand-500 hover:text-brand-600 text-slate-700 px-8 py-3.5 rounded-xl font-bold transition shadow-sm hover:shadow-md flex items-center justify-center gap-2">
                    <i class="fas fa-cubes"></i> 浏览解决方案
                </a>
            </div>

            <!-- Quick Links -->
            <div class="mt-16 pt-8 border-t border-slate-200/60">
                <p class="text-sm text-slate-400 mb-4">您可能在寻找：</p>
                <div class="flex flex-wrap justify-center gap-6 text-sm font-medium">
                    <a href="/resources/" class="text-slate-600 hover:text-brand-600 transition">行业洞察</a>
                    <a href="/diagnostic/" class="text-slate-600 hover:text-brand-600 transition">人效诊断</a>
                    <a href="/about/" class="text-slate-600 hover:text-brand-600 transition">联系我们</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Simple Footer -->
    <footer class="bg-white border-t border-slate-100 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-slate-500">
            <p>&copy; 2026 瑞华智策 版权所有</p>
        </div>
    </footer>

</body>
</html>
