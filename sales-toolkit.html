<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>营销推广话术指南 - 瑞华智策</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use specific UMD build for browser compatibility -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .brand-purple { color: #7c4dff; }
        .bg-brand-purple { background-color: #7c4dff; }
        .copy-feedback { color: #10b981 !important; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 flex flex-col items-center justify-center p-4 md:p-6 text-slate-800">



    <div id="pptContainer" class="max-w-6xl w-full bg-[#fdfdff] rounded-[1.5rem] md:rounded-[2.5rem] flex flex-col relative border border-slate-100 shadow-sm overflow-hidden md:overflow-visible">
        
        <div class="absolute top-0 right-0 w-1/3 h-full opacity-[0.03] -skew-x-12 translate-x-1/2 pointer-events-none bg-brand-purple"></div>
        <div class="absolute bottom-4 -right-4 md:right-10 text-[4rem] md:text-[8rem] font-black text-slate-200/20 italic select-none pointer-events-none tracking-tighter uppercase leading-none">
            Scripts
        </div>

        <div class="px-6 md:px-16 pt-8 md:pt-12 pb-6 z-10">
            <div class="flex items-center gap-2 mb-2 font-bold tracking-[0.2em] text-purple-600 uppercase text-[10px]">
                <i data-lucide="message-square-text" class="w-4 h-4"></i>
                Promotion Script Guide
            </div>
            <h1 class="text-2xl md:text-4xl font-black text-slate-900 tracking-tight">
                营销推广指南 <span class="text-slate-300 font-light mx-2"></span> <span class="brand-purple"></span>
            </h1>
        </div>

        <!-- Target Customer Profile Module -->
        <div class="px-6 md:px-16 pb-8 z-10 w-full">
            <div class="bg-gradient-to-r from-blue-600 to-purple-600 rounded-[1.5rem] md:rounded-[2rem] p-6 md:p-8 shadow-lg text-white relative overflow-hidden group cursor-default">
                <!-- Decorative background elements -->
                <div class="absolute top-0 right-0 w-64 h-64 bg-white opacity-10 rounded-full -translate-y-1/2 translate-x-1/4 blur-3xl"></div>
                <div class="absolute bottom-0 left-0 w-48 h-48 bg-purple-400 opacity-20 rounded-full translate-y-1/2 -translate-x-1/4 blur-2xl"></div>
                
                <div class="relative z-10">
                    <div class="flex items-center gap-2 mb-2 opacity-80 font-bold tracking-[0.15em] uppercase text-[10px]">
                        <div class="w-4 h-0.5 bg-white/50"></div>
                        Target Audience
                    </div>
                    <h2 class="text-xl md:text-3xl font-black mb-6 tracking-tight">发给谁</h2>
                    
                    <div class="bg-white/10 backdrop-blur-sm rounded-xl p-4 mb-8 border border-white/10 inline-block w-full md:w-auto">
                        <p class="text-sm font-medium italic tracking-wide">"已经度过野蛮生长期、正想从规模驱动转向效能驱动的大、中型企业"</p>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
                        <!-- Card 1 -->
                        <div class="bg-white rounded-xl p-5 text-slate-800 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-300 cursor-pointer group/card">
                            <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center mb-3 group-hover/card:bg-blue-600 group-hover/card:text-white transition-colors">
                                <i data-lucide="building-2" class="w-5 h-5"></i>
                            </div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">公司行业</h3>
                            <p class="font-black text-sm leading-tight mb-1">互联网、高科技、智能制造</p>
                            <p class="text-[10px] text-slate-500">汽车、快消连锁、国央企等</p>
                        </div>

                        <!-- Card 2 -->
                        <div class="bg-white rounded-xl p-5 text-slate-800 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-300 cursor-pointer group/card">
                            <div class="w-10 h-10 rounded-lg bg-purple-50 text-purple-600 flex items-center justify-center mb-3 group-hover/card:bg-purple-600 group-hover/card:text-white transition-colors">
                                <i data-lucide="users" class="w-5 h-5"></i>
                            </div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">人员规模</h3>
                            <p class="font-black text-sm leading-tight mb-1">1,000人以上</p>
                            <p class="text-[10px] text-slate-500">具有成熟的组织架构与管理层级</p>
                        </div>

                        <!-- Card 3 -->
                        <div class="bg-white rounded-xl p-5 text-slate-800 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-300 cursor-pointer group/card">
                            <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center mb-3 group-hover/card:bg-indigo-600 group-hover/card:text-white transition-colors">
                                <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                            </div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">营收金额</h3>
                            <p class="font-black text-sm leading-tight mb-1">年营收 5亿以上</p>
                            <p class="text-[10px] text-slate-500">业务稳定且具备数字化转型预算</p>
                        </div>

                        <!-- Card 4 -->
                        <div class="bg-white rounded-xl p-5 text-slate-800 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-300 cursor-pointer group/card">
                            <div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center mb-3 group-hover/card:bg-emerald-600 group-hover/card:text-white transition-colors">
                                <i data-lucide="user-check" class="w-5 h-5"></i>
                            </div>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">沟通人群</h3>
                            <p class="font-black text-sm leading-tight mb-1">CHO / HRVP</p>
                            <p class="text-[10px] text-slate-500">人力资源一号位及决策链关键人</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!-- Scripts Module Title -->
        <div class="px-6 md:px-16 pt-4 pb-6 z-10">
            <div class="flex items-center gap-3">
                <div class="w-1.5 h-8 rounded-full bg-brand-purple"></div>
                <h2 class="text-xl md:text-2xl font-black text-slate-900 tracking-tight">微信一对一话术</h2>
            </div>
        </div>

        <div class="flex-grow px-6 md:px-16 pb-6 z-10 flex items-center">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-6 w-full" id="cardsGrid">
                </div>
        </div>

        <!-- Module 3 Title -->
        <div class="px-6 md:px-16 pt-4 pb-6 z-10">
            <div class="flex items-center gap-3">
                <div class="w-1.5 h-8 rounded-full bg-brand-purple"></div>
                <h2 class="text-xl md:text-2xl font-black text-slate-900 tracking-tight">朋友圈文章转发语</h2>
            </div>
        </div>

        <!-- Module 3 Content -->
        <div class="px-6 md:px-16 pb-14 z-10 w-full">
            <div id="momentsCard"></div>
        </div>
        
        <div class="h-8"></div>
    </div>

    <script>
        const brandColor = "#7c4dff";
        const scripts = [
            {
                type: "痛点切入法",
                tag: "老板/CHO/HRVP",
                icon: "target",
                content: "XX总，最近我们咨询公司研发的【组织人效诊断Agent】正在实测，反响非常好。\n现在咱们肯定都在落地新年度的规划了，所以我特意为您争取到了一个免费的深度实测名额。\n如果年初咱们对企业组织问题和经营问题通过数据对标分析和结构化诊断有更加深入的洞察，对于您确认判断、把握工作重心一定会有些帮助。\n另外，这个报告还能辅助您和老板之间建立一些战略共识。\n看您是否感兴趣？我让顾问尽快给您对接一下？",
                tips: "侧重“数据对标”、“结构化诊断”及“辅助与老板建立战略共识”的价值传递。",
                dynamic: {
                    placeholder: "",
                    label: "修改称谓"
                }
            },
            {
                type: "直接邀约法",
                tag: "快速筛选/转化",
                icon: "send",
                content: "【瑞华智策·2026内测邀请】您好，我们正面向9家标杆企业开放“组织人效深度快诊”名额。\nRACE模型驱动，3天锁定经营痛点。\n名额有限，回复【1】为您确认参与资格并同步数据模板。",
                tips: "简洁明了，适合快速筛选意向客户。"
            }
        ];

        // 初始化渲染卡片
        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = scripts.map((item, idx) => {
                const inputHtml = item.dynamic ? `
                    <div class="mb-3">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-tight mb-1 block">${item.dynamic.label}</label>
                        <input type="text" id="dynamic-input-${idx}" value="${item.dynamic.placeholder}" 
                            class="w-full text-sm font-bold text-slate-700 bg-white border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500 transition-all placeholder:font-normal"
                            placeholder="请修改称呼名称"
                            oninput="updatePreview(${idx}, this.value)"
                        >
                    </div>
                ` : '';

                const contentHtml = item.dynamic 
                    ? item.content.replace('XX总', `<span class="text-red-600 font-bold" id="preview-target-${idx}">XX总</span>`).replace(/\n/g, '<br>')
                    : item.content.replace(/\n/g, '<br>');

                return `
                <div class="bg-white rounded-[2.5rem] p-8 border border-slate-100 flex flex-col relative shadow-sm hover:shadow-md transition-all group min-h-[180px]">
                    <div class="absolute left-0 top-10 bottom-10 w-1 rounded-r-full opacity-0 group-hover:opacity-100 transition-opacity bg-brand-purple"></div>
                    
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 shadow-sm" style="background-color: ${brandColor}15; color: ${brandColor}">
                                <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 class="font-black text-slate-800 text-base leading-none">${item.type}</h4>
                                <span class="text-[10px] font-bold text-slate-400 mt-1 block uppercase tracking-tight">${item.tag}</span>
                            </div>
                        </div>
                        <button id="copy-btn-${idx}" onclick="handleCopy('${encodeURIComponent(item.content)}', ${idx}, this)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[10px] font-bold transition-colors bg-slate-50 text-slate-400 hover:text-purple-600 hover:bg-purple-50 group-hover:bg-purple-50 group-hover:text-purple-600">
                            <i data-lucide="copy" class="w-3 h-3"></i>
                            <span>复制话术</span>
                        </button>
                    </div>

                    ${inputHtml}

                    <div class="bg-slate-50/50 p-4 rounded-2xl border border-slate-50/50 mb-4 group-hover:bg-white transition-colors duration-300">
                        <p class="text-[13px] text-slate-600 leading-relaxed font-medium" id="content-preview-${idx}">${contentHtml}</p>
                    </div>

                    <div class="mt-auto flex items-center gap-2 text-[10px] font-bold text-slate-400 italic">
                        <i data-lucide="chevron-right" class="w-3 h-3 text-slate-300"></i>
                        使用建议：${item.tips}
                    </div>
                </div>
            `}).join('');
            
            // 渲染图标
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        // Live Preview Update
        function updatePreview(idx, value) {
            const target = document.getElementById(`preview-target-${idx}`);
            const btn = document.getElementById(`copy-btn-${idx}`);
            
            if (target) {
                target.textContent = value || 'XX总';
            }
            
            if (btn) {
                if (!value.trim()) {
                    btn.disabled = true;
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                    btn.classList.remove('hover:text-purple-600', 'hover:bg-purple-50');
                } else {
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    btn.classList.add('hover:text-purple-600', 'hover:bg-purple-50');
                }
            }
        }

        // 渲染朋友圈转发语
        function renderMomentsCard() {
            const container = document.getElementById('momentsCard');
            const content = "我把组织能做的优化都做了，为什么经营结果还是不尽人意？\n其实，比起“盲目补漏洞”，我们更需要一次透彻的“系统体检”。\n推荐读读这篇洞察。\n💡 福利： 我们咨询公司研发的【组织人效诊断Agent】正在内测，我申请了几个深度快诊名额。\n开年想帮公司看清瓶颈、锁定重心的朋友，欢迎私信我锁定。";
            
            container.innerHTML = `
                <div class="bg-white rounded-[2.5rem] p-8 border border-slate-100 flex flex-col relative shadow-sm hover:shadow-md transition-all group">
                    <div class="absolute left-0 top-10 bottom-10 w-1 rounded-r-full opacity-0 group-hover:opacity-100 transition-opacity bg-brand-purple"></div>
                    
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 shadow-sm" style="background-color: ${brandColor}15; color: ${brandColor}">
                                <i data-lucide="share-2" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 class="font-black text-slate-800 text-base leading-none">转发语</h4>
                                <span class="text-[10px] font-bold text-slate-400 mt-1 block uppercase tracking-tight">朋友圈/社群分享</span>
                            </div>
                        </div>
                        <button onclick="handleCopy('${encodeURIComponent(content)}', 999, this)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[10px] font-bold transition-colors bg-slate-50 text-slate-400 hover:text-purple-600 hover:bg-purple-50 group-hover:bg-purple-50 group-hover:text-purple-600">
                            <i data-lucide="copy" class="w-3 h-3"></i>
                            <span>复制话术</span>
                        </button>
                    </div>

                    <div class="bg-slate-50/50 p-6 rounded-2xl border border-slate-50/50 group-hover:bg-white transition-colors duration-300">
                        <p class="text-[13px] text-slate-600 leading-relaxed font-medium">${content.replace(/\n/g, '<br>')}</p>
                    </div>
                </div>
            `;
        }

        // 复制功能
        async function handleCopy(encodedText, index, btn) {
            // 解码并去除HTML标签
            let text = decodeURIComponent(encodedText).replace(/<[^>]*>/g, '');
            
            // Handle Dynamic Replacement
            const input = document.getElementById(`dynamic-input-${index}`);
            if (input) {
                const val = input.value.trim();
                if (!val) {
                    // Visual shake or error feedback if empty (though button should be disabled)
                    input.focus();
                    input.classList.add('ring-2', 'ring-red-500');
                    setTimeout(() => input.classList.remove('ring-2', 'ring-red-500'), 500);
                    return;
                }
                // Replace XX总 with user input
                text = text.replace(/XX总/g, val);
            }

            try {
                // Try modern Clipboard API first
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    // Fallback to execCommand with better iOS support
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    
                    // iOS Safari hack to prevent zooming/scrolling
                    textArea.contentEditable = true;
                    textArea.readOnly = false;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-9999px';
                    textArea.style.top = '0';
                    
                    document.body.appendChild(textArea);
                    
                    // Save current selection
                    const range = document.createRange();
                    range.selectNodeContents(textArea);
                    const selection = window.getSelection();
                    const originalRange = selection.rangeCount > 0 ? selection.getRangeAt(0) : null;
                    
                    selection.removeAllRanges();
                    selection.addRange(range);
                    textArea.setSelectionRange(0, 999999); // For mobile devices
                    
                    const successful = document.execCommand('copy');
                    
                    // Restore original selection
                    selection.removeAllRanges();
                    if (originalRange) {
                        selection.addRange(originalRange);
                    }
                    
                    document.body.removeChild(textArea);
                    if (!successful) throw new Error('execCommand failed');
                }

                // Success Feedback
                const originalContent = btn.innerHTML;
                btn.classList.add('copy-feedback');
                btn.innerHTML = `<i data-lucide="check-circle-2" class="w-3 h-3"></i> 已复制`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                
                setTimeout(() => {
                    btn.classList.remove('copy-feedback');
                    btn.innerHTML = originalContent;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }, 2000);
            } catch (err) {
                console.error('复制失败:', err);
                // Error Feedback
                const originalContent = btn.innerHTML;
                btn.classList.add('text-red-500');
                btn.innerHTML = `<i data-lucide="x-circle" class="w-3 h-3"></i> 失败`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                
                setTimeout(() => {
                    btn.classList.remove('text-red-500');
                    btn.innerHTML = originalContent;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }, 2000);
            }
        }



        // 初始运行
        renderCards();
        renderMomentsCard();
    </script>
</body>
</html>
