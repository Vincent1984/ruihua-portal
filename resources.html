    <script>
        let categoryMap = {};

        document.addEventListener("DOMContentLoaded", () => {
            initCategories();
        });

        async function initCategories() {
            const tabsContainer = document.getElementById('category-tabs');
            try {
                const res = await fetch('/api/categories');
                const categories = await res.json();
                
                // Populate map
                if (Array.isArray(categories)) {
                    categories.forEach(cat => {
                        categoryMap[cat.code] = cat.name;
                    });
                }

                tabsContainer.innerHTML = ''; // Clear loading state
                
                // Add "All" button
                const allBtn = document.createElement('button');
                allBtn.className = 'category-tab active px-5 py-2 rounded-full border border-brand-600 bg-brand-600 text-white text-sm font-medium transition whitespace-nowrap';
                allBtn.textContent = '全部';
                allBtn.onclick = function() { loadArticles('all', this); };
                tabsContainer.appendChild(allBtn);

                if (Array.isArray(categories)) {
                    categories.forEach(cat => {
                        const btn = document.createElement('button');
                        btn.className = 'category-tab px-5 py-2 rounded-full border border-slate-200 bg-white text-slate-600 text-sm font-medium hover:border-brand-500 hover:text-brand-600 transition whitespace-nowrap';
                        btn.textContent = cat.name;
                        btn.onclick = function() { loadArticles(cat.code, this); };
                        tabsContainer.appendChild(btn);
                    });
                }
                
                // Load initial articles
                loadArticles('all', allBtn);
                
            } catch (error) {
                console.error('Failed to load categories:', error);
                tabsContainer.innerHTML = '<span class="text-red-500 text-sm">分类加载失败</span>';
                // Fallback load
                loadArticles('all');
            }
        }

        async function loadArticles(category, btnElement) {
            if (btnElement) {
                document.querySelectorAll('.category-tab').forEach(btn => {
                    btn.classList.remove('active', 'bg-brand-600', 'text-white', 'border-brand-600');
                    btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
                });
                btnElement.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');
                btnElement.classList.add('active', 'bg-brand-600', 'text-white', 'border-brand-600');
            }

            const container = document.getElementById('resources-grid');
            
            try {
                // 后端现在支持 category 参数筛选了
                const res = await fetch(`/api/articles?category=${category}`);
                const articles = await res.json();

                container.innerHTML = ''; 

                if (!articles || articles.length === 0) {
                    container.innerHTML = '<div class="text-center py-20 text-slate-500">该分类下暂无内容</div>';
                    return;
                }

                let html = '';
                const first = articles[0];
                const firstDate = new Date(first.publishDate).toLocaleDateString('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit'}).replace(/\//g, '-');
                const isWhitepaper = first.category === 'whitepaper' || first.category === '白皮书'; // 前端兼容判断
                const firstCategoryName = categoryMap[first.category] || first.category;
                
                const firstUrl = first.slug ? `/article/${first.slug}.html` : `article.html?id=${first._id}`;

                const actionBtn = isWhitepaper 
                    ? `<button onclick="openDownloadModal('${first.title}')" class="inline-flex items-center justify-center px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition shadow-lg hover:-translate-y-1"><i class="fas fa-download mr-2"></i> 下载完整版</button>`
                    : `<a href="${firstUrl}" class="inline-flex items-center justify-center px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition shadow-lg hover:-translate-y-1">阅读全文</a>`;

                html += `
                <div class="mb-16 fade-in-up">
                    <div class="bg-white rounded-3xl overflow-hidden shadow-xl border border-slate-100 group hover:shadow-2xl transition-all duration-300 grid md:grid-cols-2">
                        <div class="relative h-64 md:h-auto overflow-hidden">
                            <div class="absolute inset-0 bg-brand-900/20 group-hover:bg-transparent transition z-10"></div>
                            <img src="${first.coverImage || 'https://images.unsplash.com/photo-1542744173-8e7e53415bb0?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80'}" class="w-full h-full object-cover transform group-hover:scale-105 transition duration-700">
                        </div>
                        <div class="p-8 md:p-12 flex flex-col justify-center relative">
                            <div class="absolute top-0 right-0 p-6 opacity-10 text-9xl text-brand-500 rotate-12"><i class="fas fa-book"></i></div>
                            <span class="inline-block px-3 py-1 bg-brand-100 text-brand-700 text-xs font-bold rounded-full w-fit mb-4 uppercase">${firstCategoryName}</span>
                            <h2 class="text-3xl font-bold text-slate-900 mb-4 group-hover:text-brand-700 transition">${first.title}</h2>
                            <p class="text-slate-600 mb-8 leading-relaxed line-clamp-3">${first.summary}</p>
                            <div class="flex items-center gap-4">${actionBtn}<span class="text-sm text-slate-400">${firstDate}</span></div>
                        </div>
                    </div>
                </div>
                `;

                if (articles.length > 1) {
                    html += '<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">';
                    articles.slice(1).forEach(art => {
                        const date = new Date(art.publishDate).toLocaleDateString('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit'}).replace(/\//g, '-');
                        const artUrl = art.slug ? `/article/${art.slug}.html` : `article.html?id=${art._id}`;
                        const artCategoryName = categoryMap[art.category] || art.category;

                        const isWp = art.category === 'whitepaper' || art.category === '白皮书';
                        const cardAction = isWp
                            ? `<button onclick="openDownloadModal('${art.title}')" class="text-brand-600 font-semibold text-sm hover:underline">立即下载 →</button>`
                            : `<a href="${artUrl}" class="text-brand-600 font-semibold text-sm hover:underline">阅读文章 →</a>`;

                        html += `
                        <article class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 border border-slate-100 resource-card group flex flex-col fade-in-up">
                            <div class="h-48 overflow-hidden relative">
                                <span class="absolute top-4 left-4 bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1 rounded-full z-10 uppercase">${artCategoryName}</span>
                                <img src="${art.coverImage || 'https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'}" class="w-full h-full object-cover transition duration-500 group-hover:scale-105">
                            </div>
                            <div class="p-6 flex flex-col flex-grow">
                                <h3 class="text-xl font-bold text-slate-900 mb-3 group-hover:text-brand-600 transition line-clamp-2">${art.title}</h3>
                                <p class="text-slate-500 text-sm mb-4 line-clamp-3 flex-grow">${art.summary}</p>
                                <div class="mt-auto pt-4 border-t border-slate-100 flex justify-between items-center"><span class="text-xs text-slate-400">${date}</span>${cardAction}</div>
                            </div>
                        </article>
                        `;
                    });
                    html += '</div>';
                }

                if (articles.length >= 6) {
                    html += `<div class="mt-16 text-center"><button class="px-8 py-3 rounded-full border border-slate-300 text-slate-600 font-medium hover:bg-slate-50 hover:border-slate-400 transition">加载更多内容</button></div>`;
                }
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="text-center py-20 text-red-500">加载失败，请确保后端服务 (node server.js) 已启动</div>';
            }
        }

        function openDownloadModal(resourceName) {
            const modal = document.getElementById('downloadModal');
            const titleInput = document.getElementById('resourceName');
            if (resourceName) { document.getElementById('modal-title').textContent = '下载：' + resourceName; titleInput.value = resourceName; } else { document.getElementById('modal-title').textContent = '免费下载白皮书'; }
            modal.classList.remove('hidden');
        }
        function closeDownloadModal() { document.getElementById('downloadModal').classList.add('hidden'); }
        document.getElementById('downloadForm').addEventListener('submit', function(e) { e.preventDefault(); setTimeout(() => { alert('提交成功！'); closeDownloadModal(); }, 1500); });

        // Subscription Form Logic
        document.getElementById('subscribeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('subscribeEmail');
            const btn = document.getElementById('subscribeBtn');
            const normalText = btn.querySelector('.normal-text');
            const loadingText = btn.querySelector('.loading-text');
            
            const email = emailInput.value.trim();
            if (!email) return;

            // Simple validation
            const emailRegex = /^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$/;
            if (!emailRegex.test(email)) {
                alert('请输入有效的邮箱地址');
                return;
            }

            // Loading state
            btn.disabled = true;
            normalText.classList.add('hidden');
            loadingText.classList.remove('hidden');

            try {
                const res = await fetch('/api/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    alert('订阅成功！感谢您的关注。');
                    emailInput.value = '';
                } else {
                    alert(data.error || '订阅失败，请稍后重试');
                }
            } catch (err) {
                console.error(err);
                alert('网络错误，请检查您的连接');
            } finally {
                // Reset state
                btn.disabled = false;
                normalText.classList.remove('hidden');
                loadingText.classList.add('hidden');
            }
        });
    </script>
