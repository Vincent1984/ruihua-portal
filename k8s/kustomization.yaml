apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- configmap.yaml
# Secret 由控制台维护，不纳入 kustomize，避免用占位符覆盖线上敏感值
# 模板见 app-secret.yaml
- mongodb-deployment.yaml
- app-deployment.yaml

images:
- name: ruihuawebsite
  newTag: v1.0.0

commonLabels:
  project: ruihuawebsite
  version: v1.0

namespace: default
