apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruihua-cms-app
  namespace: default
  labels:
    app: ruihua-cms-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ruihua-cms-app
  template:
    metadata:
      labels:
        app: ruihua-cms-app
    spec:
      containers:
      - name: ruihua-cms-app
        image: ruihua-cms:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: ruihua-cms-config
        volumeMounts:
        - name: uploads-storage
          mountPath: /app/public/uploads
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ruihua-cms-service
  namespace: default
spec:
  selector:
    app: ruihua-cms-app
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: default
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi