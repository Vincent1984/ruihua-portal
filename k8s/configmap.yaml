apiVersion: v1
kind: ConfigMap
metadata:
  name: ruihuawebsite-config
  namespace: default
data:
  # 数据库配置
  DB_HOST: "mongodb-service"
  DB_PORT: "27017"
  DB_NAME: "ruihua_cms"
  MONGODB_URL: "mongodb://mongodb-service:27017/ruihua_cms"
  
  # 应用配置
  NODE_ENV: "production"
  PORT: "3000"
  CORS_ALLOWED_ORIGINS: "https://ruihuaconsulting.com,https://www.ruihuaconsulting.com,https://portal.ruihuaconsulting.com"
  
  # JWT_SECRET / SMS credentials MUST be injected via Kubernetes Secret, not ConfigMap
  # 短信接口地址（非敏感）
  SMS_API_URL: "https://rcs.uninets.com.cn/uninetsOutInterface/domesticSmsSend"

  # TOS 对象存储配置（非敏感项）
  TOS_ENDPOINT: "https://tos-cn-shanghai.volces.com"
  TOS_REGION: "cn-shanghai"
  TOS_BUCKET_NAME: "ruihua-portal"
  TOS_PUBLIC_URL: "https://ruihua-portal.tos-cn-shanghai.volces.com"
