# 应用敏感配置模板（仅作参考，真实值只在火山引擎控制台维护）
# 注意：不要把真实值提交到仓库；也不要对它执行 kubectl apply，否则会用占位符覆盖线上 Secret。
# 因此本文件未列入 kustomization.yaml 的 resources。
#
# 线上 Secret 名称：ruihuawebsite-app-secret（namespace: default）
# 使用方式：控制台 → 配置项/Secret → 编辑 → 按下方键名添加或更新 → 保存后重启 Deployment
apiVersion: v1
kind: Secret
metadata:
  name: ruihuawebsite-app-secret
  namespace: default
type: Opaque
stringData:
  # JWT 签名密钥（同时用于加密 SurveySubmission.wechatId）
  # 必须使用历史值，否则已加密的历史数据无法解密
  JWT_SECRET: "<REPLACE_WITH_ORIGINAL_JWT_SECRET>"

  # 短信服务商账号（rcs.uninets.com.cn）
  SMS_USERNAME: "<REPLACE_WITH_SMS_USERNAME>"
  SMS_PASSWORD: "<REPLACE_WITH_SMS_PASSWORD>"

  # 火山引擎 TOS 对象存储密钥（控制台 → 访问控制 → 密钥管理）
  TOS_ACCESS_KEY: "<REPLACE_WITH_TOS_ACCESS_KEY>"
  TOS_SECRET_KEY: "<REPLACE_WITH_TOS_SECRET_KEY>"

  # 钉钉机器人（可选，未配置时通知静默跳过）
  DINGTALK_WEBHOOK_URL: ""
  DINGTALK_SECRET: ""
  DINGTALK_FLOW_WEBHOOK_URL: ""
