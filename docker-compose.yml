version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_NAME=ruihua_cms
      - MONGODB_URL=mongodb://mongodb:27017/ruihua_cms
      - PORT=3000
      - ADMIN_USERNAME=zhice
      - ADMIN_PASSWORD=zhiceruihua123
    volumes:
      - ./public/uploads:/app/public/uploads
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=ruihua_cms
    restart: unless-stopped

volumes:
  mongodb_data: