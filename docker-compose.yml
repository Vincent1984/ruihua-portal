version: '3.8'

services:
  app:
    image: ruihuawebsite:latest
    # build: .
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - SITE_URL=https://www.ruihuaconsulting.com
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_NAME=ruihua_cms
      - MONGODB_URL=mongodb://mongodb:27017/ruihua_cms
      - PORT=3000
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DINGTALK_WEBHOOK_URL=${DINGTALK_WEBHOOK_URL}
      - DINGTALK_SECRET=${DINGTALK_SECRET}
      - SMS_API_URL=${SMS_API_URL}
      - SMS_USERNAME=${SMS_USERNAME}
      - SMS_PASSWORD=${SMS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_TLS_REJECT_UNAUTHORIZED=1
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ruihua-network

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=ruihua_cms
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ruihua-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  ruihua-network:
    driver: bridge