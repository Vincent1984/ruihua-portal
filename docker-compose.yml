version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_NAME=ruihua_cms
      - MONGODB_URL=mongodb://mongodb:27017/ruihua_cms
      - PORT=3000
      - ADMIN_USERNAME=zhice
      - ADMIN_PASSWORD=zhiceruihua123
      - DINGTALK_WEBHOOK_URL=https://oapi.dingtalk.com/robot/send?access_token=YOUR_ACCESS_TOKEN
      - DINGTALK_SECRET=YOUR_SECRET_KEY
      - SMS_API_URL=https://rcs.uninets.com.cn/uninetsOutInterface/domesticSmsSend
      - SMS_USERNAME=rrxt
      - SMS_PASSWORD=Renrui123
    volumes:
      - ./public/uploads:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=ruihua_cms
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data: