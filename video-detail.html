<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>视频详情 - 瑞华智策</title>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <!-- DPlayer CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
    <link rel="stylesheet" href="/css/tailwind.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-900">
<main class="pt-28 pb-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <!-- Breadcrumbs -->
      <nav class="flex items-center gap-2 text-sm text-slate-500 mb-6">
        <a href="/" class="hover:text-brand-600">首页</a>
        <i class="fas fa-chevron-right text-[10px]"></i>
        <a href="/nqoc" class="hover:text-brand-600">新质组织研究<span class="inline-flex items-center justify-center px-1.5 py-[1px] ml-1.5 text-[9px] font-black tracking-wider text-white uppercase bg-gradient-to-r from-[#ff6a00] to-[#ee0979] rounded-tl-md rounded-tr-md rounded-br-md rounded-bl-sm shadow-sm -translate-y-1 relative">HOT<span class="absolute top-0 right-0 w-1.5 h-1.5 bg-white rounded-full opacity-30 animate-ping"></span></span></a>
        <i class="fas fa-chevron-right text-[10px]"></i>
        <span class="text-slate-900 font-medium truncate" id="breadcrumb-title">视频详情</span>
      </nav>

      <div class="grid lg:grid-cols-3 gap-8">
        <!-- Main Content (Left) -->
        <div class="lg:col-span-2 flex flex-col space-y-8">
          <!-- Video Player Section -->
          <div class="bg-black rounded-2xl overflow-hidden shadow-2xl aspect-video relative group flex-shrink-0">
            <div id="video-container" class="w-full h-full flex items-center justify-center">
                <!-- Video/Embed will be injected here -->
                <div class="animate-pulse flex flex-col items-center">
                    <i class="fas fa-circle-notch fa-spin text-white/20 text-4xl mb-4"></i>
                    <p class="text-white/40 text-sm">正在加载视频资源...</p>
                </div>
            </div>
          </div>

          <!-- Video Info -->
          <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-100 flex-grow">
            <div class="flex flex-wrap items-center gap-3 mb-4" id="video-tags">
              <!-- Tags injected here -->
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-4" id="video-title">加载中...</h1>
            <div class="flex items-center gap-6 text-sm text-slate-500 mb-8 border-b border-slate-50 pb-6">
              <span class="flex items-center gap-1.5"><i class="far fa-calendar"></i> <span id="video-date">--</span></span>
              <span class="flex items-center gap-1.5"><i class="far fa-eye"></i> <span id="video-views">0</span> 次播放</span>
              <span class="flex items-center gap-1.5"><i class="far fa-clock"></i> <span id="video-duration">--</span></span>
            </div>

            <!-- Content Tabs -->
            <div class="space-y-6">
              <div class="flex border-b border-slate-100 gap-8">
                <button class="pb-3 border-b-2 border-brand-600 text-brand-600 font-bold text-sm">详情介绍</button>
              </div>
              <div class="prose prose-slate max-w-none text-slate-600 leading-relaxed" id="video-content">
                <!-- Rich text content here -->
              </div>
            </div>

            <!-- FAQ Section -->
            <div id="faq-section" class="mt-12 hidden">
              <h3 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                <i class="fas fa-question-circle text-brand-600"></i> 常见问题解答
              </h3>
              <div class="space-y-4" id="faq-accordion">
                <!-- FAQ items injected here -->
              </div>
            </div>
          </div>
        </div>

        <!-- Sidebar (Right) -->
        <div class="flex flex-col space-y-8">
          <!-- Efficiency Diagnosis Ad Card -->
          <div id="productivity-ad-banner" class="bg-gradient-to-br from-[#7c4dff] to-[#5e35b1] rounded-2xl p-6 text-white shadow-xl shadow-[#7c4dff]/20 relative overflow-hidden group cursor-pointer flex flex-col" onclick="window.location.href='/contact'">
            <!-- Decorative Background Elements -->
            <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white opacity-10 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
            <div class="absolute bottom-0 left-0 -mb-4 -ml-4 w-20 h-20 bg-white opacity-10 rounded-full blur-xl group-hover:scale-150 transition-transform duration-700 delay-100"></div>
            
            <div class="relative z-10 flex flex-col h-full">
              <div>
                <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/20 text-white text-xs font-semibold mb-4 backdrop-blur-sm">
                  <i class="fas fa-bolt text-yellow-300"></i> 限时免费评估
                </div>
                <h3 class="text-2xl font-bold mb-2 tracking-tight"><span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-purple-200">组织人效智能体检Agent</span></h3>
                <p class="text-purple-100 text-sm mb-6 leading-relaxed">通过科学的诊断模型，为您精准定位组织效能痛点，量化人力资本投资回报。</p>
              </div>
              
              <div class="grid grid-cols-2 gap-3 mb-6 flex-grow">
                <!-- R -->
                <div class="bg-white rounded-xl p-3 shadow-sm border border-purple-100 hover:border-purple-300 transition-colors flex flex-col justify-center">
                  <div class="flex items-center gap-1.5 mb-1.5">
                    <span class="text-2xl font-black text-[#8b5cf6] leading-none">R</span>
                    <h4 class="text-[13px] font-bold text-slate-800 leading-tight">人效对标</h4>
                  </div>
                  <p class="text-[11px] text-slate-500 leading-snug">排查利润黑洞<br>识别低效投入</p>
                </div>
                <!-- A -->
                <div class="bg-white rounded-xl p-3 shadow-sm border border-purple-100 hover:border-purple-300 transition-colors flex flex-col justify-center">
                  <div class="flex items-center gap-1.5 mb-1.5">
                    <span class="text-2xl font-black text-[#8b5cf6] leading-none">A</span>
                    <h4 class="text-[13px] font-bold text-slate-800 leading-tight">结构适配</h4>
                  </div>
                  <p class="text-[11px] text-slate-500 leading-snug">评估组织架构<br>支撑业务增长</p>
                </div>
                <!-- C -->
                <div class="bg-white rounded-xl p-3 shadow-sm border border-purple-100 hover:border-purple-300 transition-colors flex flex-col justify-center">
                  <div class="flex items-center gap-1.5 mb-1.5">
                    <span class="text-2xl font-black text-[#8b5cf6] leading-none">C</span>
                    <h4 class="text-[13px] font-bold text-slate-800 leading-tight">人才动能</h4>
                  </div>
                  <p class="text-[11px] text-slate-500 leading-snug">识别核心能力<br>评估梯队健康度</p>
                </div>
                <!-- E -->
                <div class="bg-white rounded-xl p-3 shadow-sm border border-purple-100 hover:border-purple-300 transition-colors flex flex-col justify-center">
                  <div class="flex items-center gap-1.5 mb-1.5">
                    <span class="text-2xl font-black text-[#8b5cf6] leading-none">E</span>
                    <h4 class="text-[13px] font-bold text-slate-800 leading-tight">组织活力</h4>
                  </div>
                  <p class="text-[11px] text-slate-500 leading-snug">量化员工敬业度<br>判断长效动力</p>
                </div>
              </div>

              <div class="mt-auto pt-2">
                <button class="w-full bg-white text-[#5e35b1] font-bold py-3.5 rounded-xl hover:bg-purple-50 transition-all shadow-lg group-hover:shadow-white/20 flex items-center justify-center gap-2">
                  预约体验 <i class="fas fa-arrow-right text-sm group-hover:translate-x-1 transition-transform"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Speaker Card (Moved here) -->
          <div id="speaker-section" class="hidden bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
            <div class="flex items-start gap-4">
              <img id="speaker-avatar" src="" alt="" class="w-14 h-14 rounded-full object-cover border-2 border-slate-50 shadow-sm shrink-0">
              <div>
                <h4 class="font-bold text-slate-900 text-base mb-1" id="speaker-name"></h4>
                <p class="text-brand-600 text-xs font-medium mb-2" id="speaker-title"></p>
                <p class="text-slate-500 text-xs leading-relaxed line-clamp-3" id="speaker-desc"></p>
              </div>
            </div>
          </div>

          <!-- Related Videos -->
          <div>
            <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center justify-between">
              相关推荐
              <a href="/videos/" class="text-brand-600 text-xs font-medium hover:underline">查看更多</a>
            </h3>
            <div class="space-y-4" id="related-videos">
              <!-- Related videos injected here -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
<!-- DPlayer Library -->
  <script src="https://cdn.jsdelivr.net/npm/flv.js/dist/flv.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>
  
  <script src="/js/main.js"></script>
  <script src="/js/video-detail.js"></script>
</body>
</html>
