<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>视频详情 - 瑞华智策</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-900">
  <header class="fixed w-full z-50 glass-nav transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        <div class="flex items-center gap-2">
          <a href="/" class="flex items-center gap-2" title="瑞华智策首页">
            <img src="/images/logo.png" alt="瑞华智策 Logo" class="h-8 w-auto" />
          </a>
          <span class="hidden sm:inline-block text-slate-300 mx-2">|</span>
          <span class="hidden sm:inline-block text-sm text-slate-500">视频中心</span>
        </div>
        <nav class="hidden lg:flex space-x-2" aria-label="桌面端导航">
          <a href="/" class="nav-link" title="首页">首页</a>
          <a href="/solutions/" class="nav-link" title="解决方案">解决方案</a>
          <a href="/resources/" class="nav-link" title="行业洞察">行业洞察</a>
          <a href="/videos.html" class="nav-link font-semibold text-brand-700 bg-brand-50" title="视频中心">视频中心</a>
          <a href="/about/" class="nav-link" title="关于我们">关于我们</a>
        </nav>
        <div class="hidden md:flex items-center space-x-4">
          <button onclick="toggleMobileMenu()" class="text-slate-500 hover:text-brand-600 transition-colors p-2 rounded-full hover:bg-slate-50" aria-label="菜单">
            <i class="fas fa-bars text-lg"></i>
          </button>
          <a href="/productivity/" class="bg-brand-600 hover:bg-brand-700 text-white px-6 py-2.5 rounded-full font-medium transition shadow-lg shadow-brand-500/20 hover:-translate-y-0.5 text-sm" title="预约专家咨询">
            预约专家咨询
          </a>
        </div>
        <button class="lg:hidden p-2 rounded-lg hover:bg-slate-100" onclick="toggleMobileMenu()" aria-label="切换移动端菜单">
          <i class="fas fa-bars text-slate-600 text-xl"></i>
        </button>
      </div>
    </div>
    <nav id="mobileMenu" class="hidden lg:hidden bg-white border-t border-slate-100 px-4 py-4" aria-label="移动端导航">
      <div class="flex flex-col space-y-2">
        <a href="/" class="mobile-nav-link" title="首页">首页</a>
        <a href="/solutions/" class="mobile-nav-link" title="解决方案">解决方案</a>
        <a href="/resources/" class="mobile-nav-link" title="行业洞察">行业洞察</a>
        <a href="/videos.html" class="mobile-nav-link font-semibold text-brand-700 bg-brand-50" title="视频中心">视频中心</a>
        <a href="/about/" class="mobile-nav-link" title="关于我们">关于我们</a>
      </div>
    </nav>
  </header>

  <main class="pt-28 pb-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <!-- Breadcrumbs -->
      <nav class="flex items-center gap-2 text-sm text-slate-500 mb-6">
        <a href="/" class="hover:text-brand-600">首页</a>
        <i class="fas fa-chevron-right text-[10px]"></i>
        <a href="/videos/" class="hover:text-brand-600">视频中心</a>
        <i class="fas fa-chevron-right text-[10px]"></i>
        <span class="text-slate-900 font-medium truncate" id="breadcrumb-title">视频详情</span>
      </nav>

      <div class="grid lg:grid-cols-3 gap-8">
        <!-- Main Content (Left) -->
        <div class="lg:col-span-2 space-y-8">
          <!-- Video Player Section -->
          <div class="bg-black rounded-2xl overflow-hidden shadow-2xl aspect-video relative group">
            <div id="video-container" class="w-full h-full flex items-center justify-center">
                <!-- Video/Embed will be injected here -->
                <div class="animate-pulse flex flex-col items-center">
                    <i class="fas fa-circle-notch fa-spin text-white/20 text-4xl mb-4"></i>
                    <p class="text-white/40 text-sm">正在加载视频资源...</p>
                </div>
            </div>
          </div>

          <!-- Video Info -->
          <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-100">
            <div class="flex flex-wrap items-center gap-3 mb-4" id="video-tags">
              <!-- Tags injected here -->
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-4" id="video-title">加载中...</h1>
            <div class="flex items-center gap-6 text-sm text-slate-500 mb-8 border-b border-slate-50 pb-6">
              <span class="flex items-center gap-1.5"><i class="far fa-calendar"></i> <span id="video-date">--</span></span>
              <span class="flex items-center gap-1.5"><i class="far fa-eye"></i> <span id="video-views">0</span> 次播放</span>
              <span class="flex items-center gap-1.5"><i class="far fa-clock"></i> <span id="video-duration">--</span></span>
            </div>

            <!-- Content Tabs -->
            <div class="space-y-6">
              <div class="flex border-b border-slate-100 gap-8">
                <button class="pb-3 border-b-2 border-brand-600 text-brand-600 font-bold text-sm">详情介绍</button>
              </div>
              <div class="prose prose-slate max-w-none text-slate-600 leading-relaxed" id="video-content">
                <!-- Rich text content here -->
              </div>
            </div>
          </div>

          <!-- Speaker Card -->
          <div id="speaker-section" class="hidden bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-start gap-6">
            <img id="speaker-avatar" src="" alt="" class="w-16 h-16 rounded-full object-cover border-2 border-slate-50 shadow-sm">
            <div>
              <h3 class="font-bold text-slate-900 text-lg mb-1" id="speaker-name"></h3>
              <p class="text-brand-600 text-sm font-medium mb-3" id="speaker-title"></p>
              <p class="text-slate-500 text-sm leading-relaxed" id="speaker-desc"></p>
            </div>
          </div>
        </div>

        <!-- Sidebar (Right) -->
        <div class="space-y-8">
          <!-- Lead Generation Card -->
          <div class="bg-gradient-to-br from-brand-600 to-brand-800 rounded-2xl p-6 text-white shadow-xl shadow-brand-500/20">
            <h3 class="text-xl font-bold mb-2">获取完整方案</h3>
            <p class="text-brand-100 text-sm mb-6 leading-relaxed">想要了解更多关于组织效能提升的实战经验？立即预约专家咨询。</p>
            <form id="lead-form" class="space-y-3">
              <input type="text" placeholder="您的姓名" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-sm placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-white/30 transition">
              <input type="tel" placeholder="联系电话" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-sm placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-white/30 transition">
              <button type="submit" class="w-full bg-white text-brand-700 font-bold py-3 rounded-xl hover:bg-brand-50 transition shadow-lg">立即提交</button>
            </form>
          </div>

          <!-- Related Videos -->
          <div>
            <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center justify-between">
              相关推荐
              <a href="/videos/" class="text-brand-600 text-xs font-medium hover:underline">查看更多</a>
            </h3>
            <div class="space-y-4" id="related-videos">
              <!-- Related videos injected here -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/js/main.js"></script>
  <script src="/js/video-detail.js"></script>
  <script type="module">
    import { FooterComponent } from '/js/FooterComponent.js';
    new FooterComponent().render('#footer-container');
  </script>
</body>
</html>
