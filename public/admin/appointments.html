<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约管理 - 瑞华智策后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { display: flex; min-height: 100vh; background-color: #f8f9fa; }
        .sidebar { width: 260px; background-color: #212529; color: white; padding-top: 20px; flex-shrink: 0; }
        .sidebar a { color: #adb5bd; padding: 15px 25px; display: block; text-decoration: none; }
        .sidebar a.active, .sidebar a:hover { background-color: #0d6efd; color: white; }
        .content { flex-grow: 1; padding: 30px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h4 class="text-center mb-4 text-white">CMS 系统</h4>
        <a href="dashboard.html" id="nav-banner"><i class="bi bi-image"></i> Banner管理</a>
        <a href="dashboard.html" id="nav-sidebar"><i class="bi bi-layout-sidebar"></i> 侧边栏配置</a>
        <a href="dashboard.html" id="nav-article"><i class="bi bi-file-text"></i> 文章管理</a>
        <a href="dashboard.html" id="nav-faq"><i class="bi bi-question-circle"></i> FAQ管理</a>
        <a href="appointments.html" id="nav-appointments" class="active"><i class="bi bi-calendar-check"></i> 预约管理</a>
        <div class="mt-5 text-center"><a href="index.html" class="text-danger">退出登录</a></div>
    </div>

    <div class="content">
        <div>
            <h3>预约管理</h3>
            <hr>
            
            <!-- 统计卡片 -->
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card text-center">
                        <div class="card-body">
                            <i class="bi bi-calendar-check text-primary" style="font-size: 2rem;"></i>
                            <h5 class="card-title mt-2">总预约数</h5>
                            <h3 class="text-primary" id="totalCount">-</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center">
                        <div class="card-body">
                            <i class="bi bi-clock text-warning" style="font-size: 2rem;"></i>
                            <h5 class="card-title mt-2">今日新增</h5>
                            <h3 class="text-warning" id="todayCount">-</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center">
                        <div class="card-body">
                            <i class="bi bi-building text-success" style="font-size: 2rem;"></i>
                            <h5 class="card-title mt-2">企业数量</h5>
                            <h3 class="text-success" id="companyCount">-</h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 预约列表 -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-0">预约列表</h5>
                        <small class="text-muted">最新的预约信息</small>
                    </div>
                    <button onclick="refreshData()" class="btn btn-primary btn-sm">
                        <i class="bi bi-arrow-clockwise me-1"></i>刷新
                    </button>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>姓名</th>
                                <th>公司</th>
                                <th>职位</th>
                                <th>手机</th>
                                <th>问题</th>
                                <th>提交时间</th>
                                <th>来源</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentsList">
                            <tr>
                                <td colspan="7" class="text-center text-muted">
                                    <i class="bi bi-arrow-clockwise spin me-2"></i>加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 分页 -->
                <div class="card-footer d-flex justify-content-between align-items-center">
                    <div>
                        <small class="text-muted" id="paginationInfo">
                            显示 <span class="fw-medium">1</span> 到 <span class="fw-medium">10</span> 条，共 <span class="fw-medium">0</span> 条记录
                        </small>
                    </div>
                    <nav>
                        <ul class="pagination pagination-sm mb-0" id="pagination">
                            <!-- 分页按钮将通过 JavaScript 生成 -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const pageSize = 20;

        // 加载预约数据
        async function loadAppointments(page = 1) {
            try {
                const response = await fetch(`/api/appointments?page=${page}&limit=${pageSize}`);
                const result = await response.json();
                
                if (result.success) {
                    displayAppointments(result.data);
                    updatePagination(result.pagination);
                    updateStatistics(result.data, result.pagination.total);
                } else {
                    console.error('加载失败:', result.error);
                }
            } catch (error) {
                console.error('网络错误:', error);
                document.getElementById('appointmentsList').innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-4 text-center text-red-500">
                            <i class="fas fa-exclamation-triangle mr-2"></i>加载失败，请刷新重试
                        </td>
                    </tr>
                `;
            }
        }

        // 显示预约列表
        function displayAppointments(appointments) {
            const tbody = document.getElementById('appointmentsList');
            
            if (appointments.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-muted py-4">
                            <i class="bi bi-inbox me-2"></i>暂无预约记录
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = appointments.map(appointment => `
                <tr>
                    <td class="fw-medium">${appointment.name}</td>
                    <td>${appointment.company}</td>
                    <td>${appointment.title}</td>
                    <td>
                        <a href="tel:${appointment.phone}" class="text-primary text-decoration-none">${appointment.phone}</a>
                    </td>
                    <td class="text-truncate" style="max-width: 200px;" title="${appointment.problem || '无'}">
                        ${appointment.problem || '无'}
                    </td>
                    <td class="text-muted small">
                        ${new Date(appointment.createdAt).toLocaleString('zh-CN')}
                    </td>
                    <td>
                        <span class="badge bg-primary">${appointment.source}</span>
                    </td>
                </tr>
            `).join('');
        }

        // 更新统计信息
        function updateStatistics(appointments, total) {
            document.getElementById('totalCount').textContent = total;
            
            // 计算今日新增
            const today = new Date().toDateString();
            const todayCount = appointments.filter(app => 
                new Date(app.createdAt).toDateString() === today
            ).length;
            document.getElementById('todayCount').textContent = todayCount;
            
            // 计算企业数量
            const companies = new Set(appointments.map(app => app.company));
            document.getElementById('companyCount').textContent = companies.size;
        }

        // 更新分页
        function updatePagination(pagination) {
            const { page, pages, total, limit } = pagination;
            currentPage = page;
            
            // 更新分页信息
            const start = (page - 1) * limit + 1;
            const end = Math.min(page * limit, total);
            document.getElementById('paginationInfo').innerHTML = `
                显示 <span class="fw-medium">${start}</span> 到 <span class="fw-medium">${end}</span> 条，共 <span class="fw-medium">${total}</span> 条记录
            `;
            
            // 生成分页按钮
            const paginationEl = document.getElementById('pagination');
            let paginationHTML = '';
            
            // 上一页
            if (page > 1) {
                paginationHTML += `<li class="page-item"><a class="page-link" href="#" onclick="loadAppointments(${page - 1}); return false;">上一页</a></li>`;
            }
            
            // 页码
            for (let i = Math.max(1, page - 2); i <= Math.min(pages, page + 2); i++) {
                const isActive = i === page;
                paginationHTML += `
                    <li class="page-item ${isActive ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="loadAppointments(${i}); return false;">${i}</a>
                    </li>
                `;
            }
            
            // 下一页
            if (page < pages) {
                paginationHTML += `<li class="page-item"><a class="page-link" href="#" onclick="loadAppointments(${page + 1}); return false;">下一页</a></li>`;
            }
            
            paginationEl.innerHTML = paginationHTML;
        }

        // 刷新数据
        function refreshData() {
            loadAppointments(currentPage);
        }

        // 页面加载时获取数据
        document.addEventListener('DOMContentLoaded', () => {
            loadAppointments();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
