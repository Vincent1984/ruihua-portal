<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞华智策 - 后台登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #eef2f7; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); width: 360px; }
        .btn-brand { background-color: #212529; color: white; width: 100%; padding: 10px; }
        .btn-brand:hover { background-color: #000; color: white; }
    </style>
</head>
<body>
    <div class="login-box">
        <h4 class="text-center mb-4">CMS 登录</h4>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-muted small">账号</label>
                <input type="text" id="u" class="form-control" placeholder="zhice" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small">密码</label>
                <input type="password" id="p" class="form-control" placeholder="zhiceruihua123" required>
            </div>
            <button type="submit" class="btn btn-brand">进入后台</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
            });
            const data = await res.json();
            if(data.success) location.href = '/dashboard.html';
            else alert('登录失败');
        };
    </script>
</body>
</html>
