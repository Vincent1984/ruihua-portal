    <div id="toastNotification" class="fixed top-6 left-1/2 -translate-x-1/2 z-[150] flex items-center gap-3 px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 transform -translate-y-full opacity-0">
        <i id="toastIcon" class="fas fa-check-circle text-lg"></i>
        <span id="toastMessage" class="text-sm font-medium tracking-wide"></span>
    </div>

    <script>
    // --- Global Toast Logic ---
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toastNotification');
        const icon = document.getElementById('toastIcon');
        const msg = document.getElementById('toastMessage');

        msg.textContent = message;

        toast.className = 'fixed top-6 left-1/2 -translate-x-1/2 z-[150] flex items-center gap-3 px-5 py-3 rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.3)] transition-all duration-300 transform border backdrop-blur-md';

        if (type === 'success') {
            toast.classList.add('bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-400');
            icon.className = 'fas fa-check-circle text-emerald-400 text-lg';
        } else if (type === 'error') {
            toast.classList.add('bg-rose-500/10', 'border-rose-500/20', 'text-rose-400');
            icon.className = 'fas fa-exclamation-circle text-rose-400 text-lg';
        } else if (type === 'warning') {
            toast.classList.add('bg-amber-500/10', 'border-amber-500/20', 'text-amber-400');
            icon.className = 'fas fa-exclamation-triangle text-amber-400 text-lg';
        }

        requestAnimationFrame(() => {
            toast.classList.remove('-translate-y-full', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
        });

        setTimeout(() => {
            toast.classList.remove('translate-y-0', 'opacity-100');
            toast.classList.add('-translate-y-full', 'opacity-0');
        }, 3000);
    }

    // --- 表单提交 ---
    document.getElementById('whitepaperForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('wpSubmitBtn');
        const data = {
            name: document.getElementById('wpName').value.trim(),
            company: document.getElementById('wpCompany').value.trim(),
            position: document.getElementById('wpPosition').value.trim(),
            email: document.getElementById('wpEmail').value.trim(),
            phone: document.getElementById('wpPhone').value.trim()
        };

        if (!/^1[3-9]\d{9}$/.test(data.phone)) {
            showToast('请输入有效的11位手机号', 'warning');
            return;
        }

        try {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 提交中...';

            const res = await fetch('/api/nqoc/whitepaper/apply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();

            if (res.ok && result.success) {
                document.getElementById('successEmailDisplay').textContent = data.email;
                document.getElementById('applyCard').classList.add('hidden');
                document.getElementById('applySuccess').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                showToast(result.error || '提交失败', 'error');
            }
        } catch (err) {
            console.error(err);
            showToast('网络错误，请稍后重试', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>抢鲜领取报告</span><i class="fas fa-arrow-right text-sm"></i>';
        }
    });
    </script>
