<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600" preserveAspectRatio="xMidYMid slice">
<style>
.fb{transform-box:fill-box}
@keyframes grow{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.86)}}
@keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.5)}}
@keyframes ripple{0%{opacity:0;transform:scale(.25)}18%{opacity:.75}100%{opacity:0;transform:scale(1)}}
@keyframes ring{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-10px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-12px,8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes near{0%,100%{transform:translateX(0)}50%{transform:translateY(var(--dy))}}
@keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
.grow{transform-origin:50% 100%;animation:grow 5s ease-in-out infinite}
.wave{transform-origin:50% 50%;animation:wave 1.8s ease-in-out infinite}
.pulse{transform-origin:50% 50%;animation:pulse 3s ease-in-out infinite}
.ripple{transform-origin:50% 50%;animation:ripple 7s linear infinite}
.ring{transform-origin:50% 50%;animation:ring 3.6s ease-out infinite}
.breathe{animation:breathe 6s ease-in-out infinite}
.drift{animation:drift 14s ease-in-out infinite}
.drift2{animation:drift2 18s ease-in-out infinite}
.glow{animation:glow 8s ease-in-out infinite}
.spin{transform-origin:50% 50%;animation:spin 60s linear infinite}
.spin-r{transform-origin:50% 50%;animation:spin 80s linear infinite reverse}
.near{animation:near 10s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
