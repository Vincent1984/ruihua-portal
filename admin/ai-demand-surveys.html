<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞华智策 - AI 需求表单管理</title>
    <script>
        (function () {
            try {
                var isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
                var token = sessionStorage.getItem('token');
                if (!isLoggedIn || !token) {
                    window.location.href = '/admin/index.html';
                }
            } catch (e) {
                window.location.href = '/admin/index.html';
            }
        })();
    </script>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="admin-theme.css">
    <link rel="stylesheet" href="/admin/admin-sidebar.css">
    <style>
        .cell-clamp {
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .detail-label {
            font-size: 12px;
            color: #6c757d;
        }
        .detail-value {
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/favicon.ico">
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner-border text-primary" role="status"></div>
</div>

<div class="admin-layout">
    <div class="sidebar"></div>

    <div class="main-content">
        <div class="header">
            <h4 class="m-0">AI 需求表单管理</h4>
            <div class="d-flex align-items-center">
                <div class="dropdown">
                    <button class="btn btn-outline border-0 dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i> 管理员
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item text-danger" href="/admin/index.html?logout=1">退出</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="page-content">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-3">
                            <input type="text" id="searchKeyword" class="form-control" placeholder="搜索需求名称 / 部门 / 联系人 / 描述">
                        </div>
                        <div class="col-md-2">
                            <input type="text" id="searchDept" class="form-control" placeholder="所属部门">
                        </div>
                        <div class="col-md-2">
                            <select id="searchSynced" class="form-select">
                                <option value="">全部同步状态</option>
                                <option value="true">已同步钉钉</option>
                                <option value="false">未同步钉钉</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="date" id="searchStartDate" class="form-control" title="开始日期">
                        </div>
                        <div class="col-md-2">
                            <input type="date" id="searchEndDate" class="form-control" title="结束日期">
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button class="btn btn-primary flex-fill" onclick="loadData(1)"><i class="bi bi-search"></i> 查询</button>
                            <button class="btn btn-outline-secondary" onclick="resetFilters()"><i class="bi bi-arrow-counterclockwise"></i> 重置</button>
                            <button class="btn btn-success" onclick="exportData()"><i class="bi bi-file-earmark-excel"></i> 导出</button>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <div class="text-secondary small">
                            共 <span id="totalCount">0</span> 条记录，当前第 <span id="currentPage">1</span>/<span id="totalPages">1</span> 页
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-danger" id="batchDeleteBtn" onclick="batchDelete()" disabled>
                                <i class="bi bi-trash"></i> 批量删除
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width:36px;"><input type="checkbox" id="checkAll" onchange="toggleCheckAll(this)"></th>
                                    <th>提交时间</th>
                                    <th>所属部门</th>
                                    <th>需求名称</th>
                                    <th>联系人</th>
                                    <th>需求描述</th>
                                    <th>月工时</th>
                                    <th>钉钉同步</th>
                                    <th style="width:130px;">操作</th>
                                </tr>
                            </thead>
                            <tbody id="dataTableBody">
                                <tr><td colspan="9" class="text-center text-secondary py-4">加载中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                    <div class="text-secondary small">数据来自官网 AI 应用需求问卷（/rh-ai-demand-survey）</div>
                    <nav>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item"><button class="page-link" onclick="changePage(-1)">上一页</button></li>
                            <li class="page-item"><button class="page-link" onclick="changePage(1)">下一页</button></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">表单详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="detail-label">所属部门</div>
                        <div class="detail-value fw-bold" id="d-dept"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="detail-label">需求名称</div>
                        <div class="detail-value fw-bold" id="d-title"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="detail-label">需求联系人</div>
                        <div class="detail-value" id="d-contact"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="detail-label">提交时间</div>
                        <div class="detail-value" id="d-time"></div>
                    </div>

                    <div class="col-12"><hr class="my-1"></div>

                    <div class="col-12">
                        <div class="detail-label">Q1 希望 AI 帮助完成的具体工作</div>
                        <div class="detail-value" id="d-q1"></div>
                    </div>
                    <div class="col-12">
                        <div class="detail-label">Q2 目前这件工作是怎么完成的</div>
                        <div class="detail-value" id="d-q2"></div>
                    </div>
                    <div class="col-12">
                        <div class="detail-label">Q3 目前最头疼的问题</div>
                        <div class="detail-value" id="d-q3"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="detail-label">Q4 发生频率</div>
                        <div class="detail-value" id="d-q4"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="detail-label">Q5 工作量</div>
                        <div class="detail-value" id="d-q5"></div>
                    </div>
                    <div class="col-12">
                        <div class="detail-label">Q6 所需资料或系统</div>
                        <div class="detail-value" id="d-q6"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="detail-label">Q7 处理方式</div>
                        <div class="detail-value" id="d-q7"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="detail-label">Q8 出错影响</div>
                        <div class="detail-value" id="d-q8"></div>
                    </div>
                    <div class="col-12">
                        <div class="detail-label">Q9 期望效果</div>
                        <div class="detail-value" id="d-q9"></div>
                    </div>
                    <div class="col-12">
                        <div class="detail-label">Q10 可提供的真实案例</div>
                        <div class="detail-value" id="d-q10"></div>
                    </div>

                    <div class="col-12"><hr class="my-1"></div>

                    <div class="col-md-6">
                        <div class="detail-label">附件名称</div>
                        <div class="detail-value" id="d-attachment"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="detail-label">提交编号</div>
                        <div class="detail-value" id="d-submission-id"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="detail-label">钉钉表格同步</div>
                        <div class="detail-value" id="d-synced"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="detail-label">同步错误信息</div>
                        <div class="detail-value text-muted small" id="d-sync-error"></div>
                    </div>
                    <div class="col-12">
                        <div class="detail-label">页面地址</div>
                        <div class="detail-value small text-muted text-break" id="d-page"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/aiDemandSurveys.js"></script>
<script src="/admin/js/unified-admin-sidebar.js"></script>
</body>
</html>
