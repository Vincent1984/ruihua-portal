<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录调试工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
        }
        .status.success { background: #10b981; }
        .status.error { background: #ef4444; }
        .status.warning { background: #f59e0b; }
        .info-grid {
            display: grid;
            gap: 10px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: white;
            border-radius: 4px;
            font-size: 13px;
        }
        .info-label {
            color: #666;
            font-weight: 500;
        }
        .info-value {
            color: #333;
            font-family: 'Monaco', 'Courier New', monospace;
            word-break: break-all;
        }
        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .log-line {
            margin: 4px 0;
            line-height: 1.4;
        }
        .log-error { color: #f87171; }
        .log-success { color: #34d399; }
        .log-warning { color: #fbbf24; }
        .log-info { color: #60a5fa; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge.ok { background: #d1fae5; color: #065f46; }
        .badge.error { background: #fee2e2; color: #991b1b; }
        .badge.warning { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 后台登录调试工具</h1>
        <p class="subtitle">实时检查登录状态、Cookie、Token 和认证信息</p>

        <div class="section">
            <h2><span class="status" id="statusDot"></span> 当前状态</h2>
            <div class="info-grid">
                <div class="info-row">
                    <span class="info-label">登录状态</span>
                    <span class="info-value" id="loginStatus">检查中...</span>
                </div>
                <div class="info-row">
                    <span class="info-label">SessionStorage (isLoggedIn)</span>
                    <span class="info-value" id="sessionStatus">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">SessionStorage (token)</span>
                    <span class="info-value" id="sessionToken">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Cookie (admin_token)</span>
                    <span class="info-value" id="cookieToken">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">当前用户</span>
                    <span class="info-value" id="currentUser">-</span>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>🧪 测试登录</h2>
            <div class="info-grid">
                <div class="info-row">
                    <span class="info-label">用户名</span>
                    <input type="text" id="testUsername" value="ruihua" style="border: 1px solid #ddd; padding: 6px 10px; border-radius: 4px; flex: 1; margin-left: 10px;">
                </div>
                <div class="info-row">
                    <span class="info-label">密码</span>
                    <input type="password" id="testPassword" value="Ruihua@2026" style="border: 1px solid #ddd; padding: 6px 10px; border-radius: 4px; flex: 1; margin-left: 10px;">
                </div>
            </div>
            <div class="actions">
                <button onclick="testLogin()">测试登录</button>
                <button onclick="clearAuth()">清除认证信息</button>
                <button onclick="checkAuth()">重新检查</button>
            </div>
        </div>

        <div class="section">
            <h2>📋 调试日志</h2>
            <div class="log" id="logContainer"></div>
        </div>
    </div>

    <script>
        const logs = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString('zh-CN');
            logs.push({ timestamp, message, type });

            const logContainer = document.getElementById('logContainer');
            const line = document.createElement('div');
            line.className = `log-line log-${type}`;
            line.textContent = `[${timestamp}] ${message}`;
            logContainer.appendChild(line);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function checkAuth() {
            log('开始检查认证状态...', 'info');

            // Check SessionStorage
            const isLoggedIn = sessionStorage.getItem('isLoggedIn');
            const sessionToken = sessionStorage.getItem('token');
            const userStr = sessionStorage.getItem('user');

            document.getElementById('sessionStatus').textContent = isLoggedIn || '未设置';
            document.getElementById('sessionToken').textContent = sessionToken ? sessionToken.slice(0, 20) + '...' : '未设置';

            if (isLoggedIn === 'true') {
                log('✓ SessionStorage: 已登录', 'success');
            } else {
                log('✗ SessionStorage: 未登录', 'warning');
            }

            if (sessionToken) {
                log(`✓ SessionStorage Token: ${sessionToken.slice(0, 30)}...`, 'success');
            } else {
                log('✗ SessionStorage Token: 未设置', 'warning');
            }

            // Check Cookie
            const cookieToken = getCookie('admin_token');
            document.getElementById('cookieToken').textContent = cookieToken ? cookieToken.slice(0, 20) + '...' : '未设置';

            if (cookieToken) {
                log(`✓ Cookie Token: ${cookieToken.slice(0, 30)}...`, 'success');
            } else {
                log('✗ Cookie Token: 未设置（这是关键问题！）', 'error');
            }

            // Parse user
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    document.getElementById('currentUser').textContent = user.name || user.username || '未知';
                    log(`✓ 当前用户: ${user.name || user.username}`, 'success');
                } catch (e) {
                    document.getElementById('currentUser').textContent = '解析失败';
                    log('✗ 用户信息解析失败', 'error');
                }
            } else {
                document.getElementById('currentUser').textContent = '未设置';
                log('✗ 用户信息未设置', 'warning');
            }

            // Overall status
            if (isLoggedIn === 'true' && sessionToken && cookieToken) {
                document.getElementById('loginStatus').innerHTML = '<span class="badge ok">已登录</span>';
                document.getElementById('statusDot').className = 'status success';
                log('✓ 认证状态正常', 'success');
            } else if (isLoggedIn === 'true' && sessionToken && !cookieToken) {
                document.getElementById('loginStatus').innerHTML = '<span class="badge warning">Cookie 丢失</span>';
                document.getElementById('statusDot').className = 'status warning';
                log('⚠ SessionStorage 正常但 Cookie 丢失！', 'error');
                log('  这是导致重定向到登录页的原因', 'error');
                log('  服务器需要 Cookie 中的 token 来验证请求', 'error');
            } else {
                document.getElementById('loginStatus').innerHTML = '<span class="badge error">未登录</span>';
                document.getElementById('statusDot').className = 'status error';
                log('✗ 未登录状态', 'error');
            }
        }

        async function testLogin() {
            const username = document.getElementById('testUsername').value.trim();
            const password = document.getElementById('testPassword').value;

            if (!username || !password) {
                log('✗ 请输入用户名和密码', 'error');
                return;
            }

            log(`发起登录请求: ${username}`, 'info');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                log(`服务器响应状态: ${response.status} ${response.statusText}`, 'info');

                const result = await response.json();

                if (result.success) {
                    log('✓ 登录成功！', 'success');
                    log(`Token: ${result.token?.slice(0, 30)}...`, 'success');

                    // Save to SessionStorage
                    sessionStorage.setItem('isLoggedIn', 'true');
                    if (result.token) sessionStorage.setItem('token', result.token);
                    if (result.admin || result.user) {
                        sessionStorage.setItem('user', JSON.stringify(result.admin || result.user));
                    }

                    log('✓ SessionStorage 已保存', 'success');

                    // Check Cookie
                    setTimeout(() => {
                        const cookieToken = getCookie('admin_token');
                        if (cookieToken) {
                            log('✓ Cookie 已设置！', 'success');
                            log('  可以尝试访问后台了', 'success');
                        } else {
                            log('✗ Cookie 未设置！', 'error');
                            log('  这是问题所在：服务器没有正确设置 Cookie', 'error');
                            log('  可能原因：', 'warning');
                            log('  1. 浏览器禁用了 Cookie', 'warning');
                            log('  2. HTTPS/HTTP 混用问题', 'warning');
                            log('  3. SameSite 策略限制', 'warning');
                        }

                        checkAuth();
                    }, 100);

                } else {
                    log(`✗ 登录失败: ${result.message}`, 'error');

                    if (result.message.includes('不存在')) {
                        log('  💡 用户不存在，请运行: node scripts/reset-admin.js', 'warning');
                    } else if (result.message.includes('密码')) {
                        log('  💡 密码错误，请检查密码或重置', 'warning');
                    } else if (result.message.includes('security upgrade')) {
                        log('  💡 需要密码升级，运行: node scripts/reset-admin.js', 'warning');
                    } else if (result.message.includes('禁用')) {
                        log('  💡 账号被禁用，运行诊断脚本检查', 'warning');
                    }
                }

            } catch (error) {
                log(`✗ 请求失败: ${error.message}`, 'error');
                log('  可能原因：服务器未启动或网络错误', 'error');
            }
        }

        function clearAuth() {
            sessionStorage.clear();
            document.cookie = 'admin_token=; Max-Age=0; path=/';
            log('已清除所有认证信息', 'info');
            checkAuth();
        }

        // Initial check
        log('调试工具已加载', 'success');
        checkAuth();
    </script>
</body>
</html>
