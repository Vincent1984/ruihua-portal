<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞华智策 - 后台登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/favicon.ico">
</head>
<body class="admin-login-body">
    <div class="login-box">
        <h4 class="text-center mb-4">CMS 登录</h4>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-muted small">账号</label>
                <input type="text" id="u" class="form-control" placeholder="请输入账号" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small">密码</label>
                <input type="password" id="p" class="form-control" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-brand">进入后台</button>
        </form>
    </div>
    <script src="/js/script.js"></script>
</body>
</html>
