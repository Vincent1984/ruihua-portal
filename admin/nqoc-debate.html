<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>瑞华智策 - 在线投票管理</title><script>(function(){try{if(sessionStorage.getItem("isLoggedIn")!=="true"||!sessionStorage.getItem("token"))window.location.href="/admin/index.html"}catch(e){window.location.href="/admin/index.html"}})();</script><link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="admin-theme.css"><link rel="stylesheet" href="/admin/admin-sidebar.css"><style>select.form-select option[value="not_started"]{color:#6c757d}select.form-select option[value="in_progress"]{color:#198754}select.form-select option[value="ended"]{color:#dc3545}</style></head><body><div class="admin-layout"><div id="unified-sidebar-container"></div><div class="main-content"><div class="header"><h4 class="m-0">在线投票管理</h4></div><div class="page-content"><div class="row g-4"><div class="col-md-6"><div class="card border-0 shadow-sm h-100"><div class="card-header bg-white py-3 d-flex justify-content-between align-items-center"><h5 class="mb-0">话题 1：Agent & 人，替代 or 共生？</h5><select class="form-select form-select-sm w-auto fw-bold" id="topic1_status" onchange="updateSelectColor(this)"><option value="not_started">未开始</option><option value="in_progress">进行中</option><option value="ended">已结束</option></select></div><div class="card-body"><div class="mb-3"><label class="form-label text-primary fw-bold">正方票数 (替代)</label><input type="number" class="form-control" id="topic1_proVotes" min="0"></div><div class="mb-3"><label class="form-label text-info fw-bold">反方票数 (共生)</label><input type="number" class="form-control" id="topic1_conVotes" min="0"></div></div></div></div><div class="col-md-6"><div class="card border-0 shadow-sm h-100"><div class="card-header bg-white py-3 d-flex justify-content-between align-items-center"><h5 class="mb-0">话题 2：降本 & 提效，谁该优先？</h5><select class="form-select form-select-sm w-auto fw-bold" id="topic2_status" onchange="updateSelectColor(this)"><option value="not_started">未开始</option><option value="in_progress">进行中</option><option value="ended">已结束</option></select></div><div class="card-body"><div class="mb-3"><label class="form-label text-primary fw-bold">正方票数 (降本优先)</label><input type="number" class="form-control" id="topic2_proVotes" min="0"></div><div class="mb-3"><label class="form-label text-info fw-bold">反方票数 (提效优先)</label><input type="number" class="form-control" id="topic2_conVotes" min="0"></div></div></div></div><div class="col-md-12"><div class="card border-0 shadow-sm"><div class="card-header bg-white py-3"><h5 class="mb-0">投票规则设置</h5></div><div class="card-body"><div class="row align-items-center"><div class="col-md-4"><label class="form-label fw-bold">每个设备在每个话题的最大投票数</label><input type="number" class="form-control" id="maxVotesPerDevice" min="1" max="100"></div><div class="col-md-8 text-muted small mt-md-4">此规则将同步到前端页面。前端也会使用 localStorage 进行设备级别的防刷票限制。</div></div></div><div class="card-footer bg-white text-end py-3"><button class="btn btn-primary px-4" onclick="saveConfig()">保存所有修改</button></div></div></div></div></div></div></div><script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script><script src="js/utils.js?v=6"></script><script src="/admin/js/unified-admin-sidebar.js?v=6"></script><script src="js/nqoc-debate.js?v=6"></script><script>function updateSelectColor(s){s.classList.remove("text-secondary","text-success","text-danger");if(s.value==="not_started")s.classList.add("text-secondary");if(s.value==="in_progress")s.classList.add("text-success");if(s.value==="ended")s.classList.add("text-danger");}</script></body></html>
