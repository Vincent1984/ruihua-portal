<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞华智策 - NQOC调研问卷管理</title>
    <script>
        (function () {
            try {
                var isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
                var token = sessionStorage.getItem('token');
                if (!isLoggedIn || !token) {
                    window.location.href = '/admin/index.html';
                }
            } catch (e) {
                window.location.href = '/admin/index.html';
            }
        })();
    </script>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="admin-theme.css">
    <link rel="stylesheet" href="/admin/admin-sidebar.css">
    <style>
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.7); z-index: 9999;
            display: none; justify-content: center; align-items: center;
        }
        .nav-tabs .nav-link { color: #6c757d; font-weight: 500; }
        .nav-tabs .nav-link.active { color: #0d6efd; font-weight: bold; }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner-border text-primary" role="status"></div>
</div>

<div class="admin-layout">
    <div id="unified-sidebar-container"></div>

    <div class="main-content">
        <div class="header">
            <h4 class="m-0">NQOC 调研问卷管理</h4>
            <div class="d-flex align-items-center">
                <div class="dropdown">
                    <button class="btn btn-outline border-0 dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i> 管理员
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item text-danger" href="/admin/index.html">退出</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="page-content">
            <!-- Tabs -->
            <ul class="nav nav-tabs mb-4" id="surveyTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="data-tab" data-bs-toggle="tab" data-bs-target="#data-pane" type="button" role="tab">问卷数据</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="analysis-tab" data-bs-toggle="tab" data-bs-target="#analysis-pane" type="button" role="tab">数据分析</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="channel-tab" data-bs-toggle="tab" data-bs-target="#channel-pane" type="button" role="tab">渠道溯源</button>
                </li>
            </ul>

            <div class="tab-content" id="surveyTabsContent">
                <!-- Data Pane -->
                <div class="tab-pane fade show active" id="data-pane" role="tabpanel" tabindex="0">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white py-3">
                            <div class="row g-3 align-items-center">
                                <div class="col-md-3">
                                    <input type="text" id="searchKeyword" class="form-control" placeholder="搜索企业名称/填答人/联系方式...">
                                </div>
                                <div class="col-md-2">
                                    <input type="text" id="searchChannel" class="form-control" placeholder="搜索来源渠道...">
                                </div>
                                <div class="col-md-2">
                                    <input type="date" id="searchStartDate" class="form-control" placeholder="开始时间">
                                </div>
                                <div class="col-md-2">
                                    <input type="date" id="searchEndDate" class="form-control" placeholder="结束时间">
                                </div>
                                <div class="col-md-3 d-flex gap-2">
                                    <button class="btn btn-primary w-100" onclick="loadData(1)"><i class="bi bi-search"></i> 查询</button>
                                    <button class="btn btn-success w-100" onclick="exportData()"><i class="bi bi-file-earmark-excel"></i> 导出</button>
                                </div>
                            </div>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>企业名称</th>
                                            <th>行业</th>
                                            <th>规模</th>
                                            <th>企业性质</th>
                                            <th>营收规模</th>
                                            <th>成立年限</th>
                                            <th>上市状态</th>
                                            <th>填答人</th>
                                            <th>职务</th>
                                            <th>联系方式</th>
                                            <th>提交时间</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="dataTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                        <div class="card-footer bg-white py-3">
                            <nav aria-label="Page navigation">
                                <ul class="pagination justify-content-center mb-0" id="pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </div>

                <!-- Analysis Pane -->
                <div class="tab-pane fade" id="analysis-pane" role="tabpanel" tabindex="0">
                    <div class="row g-4 mb-4">
                        <div class="col-md-3">
                            <div class="card border-0 shadow-sm text-center py-4">
                                <h6 class="text-secondary mb-2">总问卷回收量</h6>
                                <h2 class="text-primary mb-0 fw-bold" id="statTotalCount">0</h2>
                            </div>
                        </div>
                        <div class="col-md-9">
                            <div class="card border-0 shadow-sm h-100">
                                <div class="card-header bg-white py-3 border-bottom">
                                    <h6 class="mb-0">各维度平均得分 (雷达图)</h6>
                                </div>
                                <div class="card-body d-flex justify-content-center align-items-center" style="min-height: 300px;">
                                    <canvas id="radarChart" width="400" height="300"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="card border-0 shadow-sm">
                                <div class="card-header bg-white py-3 border-bottom">
                                    <h6 class="mb-0">企业总体阶段分布</h6>
                                </div>
                                <div class="card-body">
                                    <canvas id="stageChart" height="250"></canvas>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card border-0 shadow-sm">
                                <div class="card-header bg-white py-3 border-bottom">
                                    <h6 class="mb-0">核心痛点分布 (S2)</h6>
                                </div>
                                <div class="card-body">
                                    <canvas id="painPointChart" height="250"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Channel Pane -->
                <div class="tab-pane fade" id="channel-pane" role="tabpanel" tabindex="0">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                            <h5 class="m-0 text-primary">渠道管理</h5>
                            <button class="btn btn-primary" onclick="showChannelModal()"><i class="bi bi-plus-lg"></i> 新增渠道</button>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>渠道名称</th>
                                            <th>渠道代码 (code)</th>
                                            <th>描述说明</th>
                                            <th>专属链接</th>
                                            <th>创建时间</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="channelTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Channel Modal -->
<div class="modal fade" id="channelModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="channelModalTitle">新增渠道</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="channelForm">
                    <input type="hidden" id="channelId">
                    <div class="mb-3">
                        <label class="form-label">渠道名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="channelName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">渠道代码 (code) <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="channelCode" required placeholder="如: wechat_oa">
                        <div class="form-text">用于URL参数，需唯一，仅限字母数字下划线。</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">描述说明</label>
                        <textarea class="form-control" id="channelDescription" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveChannel()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- Survey Details Modal -->
<div class="modal fade" id="surveyDetailsModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">问卷详细内容</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="surveyDetailsBody">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/admin/js/unified-admin-sidebar.js"></script>
<script src="/admin/js/nqoc-survey.js"></script>
</body>
</html>
